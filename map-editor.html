<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAP EDITOR — Strike Command</title>
<style>
  :root { --bg:#0f1115; --panel:#181c22; --panel2:#1f242c; --panel3:#272d36; --line:#2a303a; --txt:#d4d9e0; --dim:#6b7680; --acc:#ffd24a; --ok:#59c06a; --err:#e06050; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--txt); font:13px/1.4 "Segoe UI",system-ui,sans-serif; display:flex; overflow:hidden; }

  /* LEFT TOOL RAIL */
  #toolrail { width:56px; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; align-items:center; padding:6px 0; gap:2px; z-index:10; flex-shrink:0; }
  #toolrail .logo { font-size:10px; font-weight:700; color:var(--acc); letter-spacing:1px; padding:6px 0 8px; text-align:center; width:100%; border-bottom:1px solid var(--line); margin-bottom:4px; }
  #toolrail button { width:40px; height:40px; background:none; border:none; color:var(--dim); border-radius:8px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; font-size:9px; transition:background .12s,color .12s; position:relative; }
  #toolrail button svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  #toolrail button:hover { background:var(--panel2); color:var(--txt); }
  #toolrail button.active { background:rgba(255,210,74,.12); color:var(--acc); }
  #toolrail .rail-sep { width:28px; height:1px; background:var(--line); margin:4px 0; }
  .tool-group { position:relative; width:40px; }
  .tool-group .group-btn { width:40px; }
  .tool-group .group-menu { display:none; position:absolute; left:48px; top:0; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:4px 0; z-index:100; min-width:160px; box-shadow:0 4px 16px rgba(0,0,0,.5); }
  .tool-group.open .group-menu { display:block; }
  .tool-group .group-menu button { width:auto; height:auto; padding:6px 14px; font-size:12px; border-radius:0; display:flex; gap:8px; align-items:center; justify-content:flex-start; }
  .tool-group .group-menu button:hover { background:rgba(255,210,74,.12); color:var(--acc); }
  .tool-group .group-menu button.active { color:var(--acc); }

  /* CENTER AREA */
  #center { flex:1; display:flex; flex-direction:column; min-width:0; }

  /* TOP BAR */
  #topbar { display:flex; align-items:center; gap:10px; padding:6px 14px; background:var(--panel); border-bottom:1px solid var(--line); flex-shrink:0; min-height:42px; }
  #topbar .file-group { display:flex; align-items:center; gap:4px; }
  #topbar select, #topbar input[type=text] { background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:5px; padding:4px 8px; font-size:12px; }
  #topbar button { background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:5px; padding:5px 12px; cursor:pointer; font-size:12px; transition:all .12s; }
  #topbar button:hover { border-color:var(--acc); color:var(--acc); }
  #topbar button.primary { background:var(--acc); color:#111; border-color:var(--acc); font-weight:600; }
  #topbar button.primary:hover { background:#ffe060; }
  #topbar .sep { width:1px; height:22px; background:var(--line); }
  #topbar .spacer { flex:1; }
  #topbar .status-group { display:flex; align-items:center; gap:8px; }
  #saveState { color:var(--ok); font-size:11px; }
  #status { color:var(--dim); font-size:11px; }
  #topbar label { color:var(--dim); font-size:11px; display:flex; align-items:center; gap:4px; }
  #topbar select { padding:3px 6px; }

  /* TOOL OPTIONS BAR */
  #toolopts { display:flex; align-items:center; gap:8px; padding:5px 14px; background:var(--panel); border-bottom:1px solid var(--line); flex-shrink:0; min-height:34px; flex-wrap:wrap; }
  #toolopts label { color:var(--dim); font-size:11px; display:flex; align-items:center; gap:4px; }
  #toolopts input[type=number] { width:52px; background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:4px; padding:2px 5px; font-size:11px; }
  #toolopts input[type=checkbox] { accent-color:var(--acc); }
  #toolopts select { background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:4px; padding:2px 5px; font-size:11px; }
  #toolopts .opt-sep { width:1px; height:16px; background:var(--line); }
  #kindLabel { display:none; }

  /* MAIN CANVAS AREA */
  #canvas-area { flex:1; display:flex; min-height:0; position:relative; }
  #pane2d { flex:1; position:relative; min-width:200px; }
  #canvas2d { position:absolute; inset:0; width:100%; height:100%; display:block; background:#0c0e11; cursor:crosshair; }
  #pane3d { flex:1; position:relative; min-width:200px; display:none; }
  #pane3d.active { display:block; }
  #pane2d.hidden { display:none; }
  #canvas3d { position:absolute; inset:0; width:100%; height:100%; display:block; background:#0c0e11; }
  #viewToggle { position:absolute; top:8px; right:8px; z-index:5; background:var(--acc); color:#111; border:none; border-radius:5px; padding:6px 14px; font-size:12px; font-weight:700; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.5); }
  #viewToggle:hover { background:#ffe060; }
  #viewToggle.active { background:#40e0ff; color:#111; }

  /* OVERLAYS */
  #coords { position:absolute; left:10px; bottom:8px; color:var(--dim); font-size:11px; background:rgba(0,0,0,.6); padding:3px 8px; border-radius:4px; pointer-events:none; }
  #hint { position:absolute; right:10px; bottom:8px; color:#4a5158; font-size:11px; pointer-events:none; }
  #legend { position:absolute; left:50%; bottom:8px; transform:translateX(-50%); background:rgba(0,0,0,.65); border:1px solid var(--line); border-radius:5px; padding:5px 10px; display:none; font-size:11px; color:var(--dim); pointer-events:none; z-index:2; max-width:85%; }
  #legend.show { display:flex; flex-wrap:wrap; gap:4px 12px; }
  #legend .lg { display:flex; align-items:center; gap:4px; }
  #legend .lg i { width:8px; height:8px; border-radius:2px; display:inline-block; }

  /* RIGHT PANEL (Inspector + Library) */
  #rightpanel { width:280px; background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; flex-shrink:0; overflow:hidden; }
  #rightpanel .rp-header { padding:8px 12px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:6px; flex-shrink:0; }
  #rightpanel .rp-header h2 { font-size:11px; color:var(--acc); text-transform:uppercase; letter-spacing:1px; flex:1; }
  #rightpanel .rp-header button { background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:4px; padding:2px 7px; cursor:pointer; font-size:10px; }
  #rightpanel .rp-header button:hover { border-color:var(--acc); color:var(--acc); }
  #insp { flex:1; overflow:auto; padding:8px 12px; }
  #insp h2 { font-size:11px; color:var(--acc); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
  #insp .row { display:flex; align-items:center; gap:6px; margin:3px 0; }
  #insp .row label { width:72px; color:var(--dim); font-size:11px; flex-shrink:0; }
  #insp .row input[type=number], #insp .row input[type=text], #insp .row select { flex:1; min-width:0; background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:4px; padding:3px 6px; font-size:12px; }
  #insp .row input[type=checkbox] { width:auto; accent-color:var(--acc); }
  #insp .row input[type=color] { width:30px; height:22px; padding:0; border:1px solid var(--line); background:var(--panel2); border-radius:3px; }
  #insp .row input:disabled { opacity:.4; }
  #insp .section { margin-top:8px; padding-top:6px; border-top:1px solid var(--line); }
  #insp .note { color:var(--dim); font-size:11px; }
  #insp button.primary { background:var(--acc); color:#14161a; border:none; font-weight:600; padding:5px 12px; border-radius:4px; cursor:pointer; }
  #issues { margin-top:8px; }
  #issues .issue { padding:3px 6px; border-radius:3px; font-size:11px; margin:2px 0; cursor:pointer; }
  #issues .issue.err { background:rgba(224,96,80,.12); color:#f0a090; }
  #issues .issue.warn { background:rgba(255,210,74,.1); color:#e8cf8a; }

  /* ASSET LIBRARY (collapsible in right panel) */
  #library { border-top:1px solid var(--line); display:flex; flex-direction:column; max-height:45%; min-height:0; flex-shrink:0; }
  #library.collapsed { max-height:32px; min-height:32px; }
  #library.collapsed .lib-body { display:none; }
  #library .lib-h { display:flex; align-items:center; gap:6px; padding:6px 12px; border-bottom:1px solid var(--line); flex-shrink:0; cursor:pointer; }
  #library .lib-h h2 { font-size:11px; color:var(--acc); text-transform:uppercase; letter-spacing:1px; }
  #library .lib-h button { background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:4px; padding:2px 6px; cursor:pointer; font-size:10px; }
  #libCount { margin-left:auto; color:var(--dim); font-size:10px; }
  #library .lib-body { flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
  #libSearch { width:100%; background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:4px; padding:4px 8px; font-size:11px; margin:6px 8px 0; width:calc(100% - 16px); }
  #libGrid { flex:1; overflow:auto; padding:4px 8px 8px; }
  .lib-cat { margin-bottom:6px; }
  .lib-cat-h { font-size:9px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; margin:4px 0 3px; }
  .lib-grid { display:flex; flex-wrap:wrap; gap:3px; }
  .tile { display:flex; align-items:center; gap:5px; background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:4px; padding:3px 6px; cursor:pointer; font-size:11px; transition:all .1s; }
  .tile:hover { border-color:var(--acc); color:var(--acc); }
  .tile.active { border-color:var(--acc); background:rgba(255,210,74,.12); color:var(--acc); }
  .tile .sw { width:8px; height:8px; border-radius:2px; flex-shrink:0; }

  /* ASSET EDITOR (fullscreen overlay) */
  #assetEditor { display:none; position:fixed; inset:0; z-index:100; background:#0c0e11; flex-direction:column; }


</style>
</head>

<!-- LEFT TOOL RAIL -->
<div id="toolrail">
  <div class="logo">MAP</div>

  <!-- INFRA group -->

    <div class="group-menu">
      <button data-tool="prop">Procedural Prop</button>

  <div class="tool-group" data-group="map">

    <div class="group-menu">

  </div>
</div>

<!-- CENTER -->
<div id="center">
  <!-- TOP BAR -->

    <label><input type="checkbox" id="roadSmooth" checked> Smooth</label>

</div>

</div>

    <span id="aeAssetName" style="color:var(--dim);font-size:12px;"></span>

      <div id="aeProps"></div>
      <h3 style="font-size:11px;color:var(--acc);text-transform:uppercase;letter-spacing:1px;margin:12px 0 8px;">Visual Overrides</h3>
      <div id="aeVisual"></div>
      <div style="margin-top:12px;">
        <button id="aeApply" class="primary" style="width:100%;padding:6px;background:var(--acc);color:#14161a;border:none;border-radius:4px;cursor:pointer;font-weight:600;">Apply & Close</button>
      </div>
    </div>
  </div>
</div>

    row.className = 'lib-grid';
    for (const it of items) {
      const t = document.createElement('button');
      t.className = 'tile';

      if (it.kind) t.dataset.kind = it.kind;
      t.title = it.desc;

  return field(labelText, `<input type="checkbox" ${val ? 'checked' : ''}>`, (i) => change(i.checked));

function toHex(m) {
  if (typeof m === 'number') return '#' + m.toString(16).padStart(6, '0');
  if (Array.isArray(m)) return '#' + m.map((v) => v.toString(16).padStart(2, '0')).join('');

}
function fromHex(h) {

    insp.append(numField('Z', it.z, (v) => { it.z = v; redrawAll(); }));
    insp.append(numField('Scale', it.s || 1, (v) => { it.s = v; redrawAll(); }, 0.1));
    insp.append(boolField('Dead', it.dead, (v) => { it.dead = v; redrawAll(); }));
    insp.append(textField('Name', it.name || '', (v) => { it.name = v; redrawAll(); }));
  } else if (cat === 'transit') {
    insp.append(numField('X', it.x, (v) => { it.x = v; redrawAll(); }));
    insp.append(numField('Z', it.z, (v) => { it.z = v; redrawAll(); }));
    insp.append(textField('Name', it.name, (v) => { it.name = v; draw2d(); dirty(); }));
  } else if (cat === 'named') {
    insp.append(numField('X', it.x, (v) => { it.x = v; redrawAll(); }));
    insp.append(numField('Z', it.z, (v) => { it.z = v; redrawAll(); }));
    insp.append(textField('Name', it.name, (v) => { it.name = v; draw2d(); dirty(); }));
    insp.append(colorField('Color', it.color, (v) => { it.color = '#' + v.map((n) => n.toString(16).padStart(2, '0')).join(''); draw2d(); dirty(); }));
  } else if (cat === 'reactives') {
    insp.append(selField('Kind', it.kind, ['flex','fire','firex'], (v) => { it.kind = v; redrawAll(); }));
    insp.append(numField('X', it.x, (v) => { it.x = v; redrawAll(); }));
    insp.append(numField('Z', it.z, (v) => { it.z = v; redrawAll(); }));
    insp.append(textField('Name', it.name || '', (v) => { it.name = v; redrawAll(); }));
  } else {
    // spawns / cover / loot are [x,z]
    insp.append(numField('X', it[0], (v) => { setPoint(cat, idx, v, it[1]); draw2d(); dirty(); }));
    insp.append(numField('Z', it[1], (v) => { setPoint(cat, idx, it[0], v); draw2d(); dirty(); }));
  }

  const del = document.createElement('button');
  del.textContent = 'Delete item';
  del.style.marginTop = '8px';
  del.addEventListener('click', () => { scene[cat].splice(idx, 1); selected = null; redrawAll(); });
  insp.append(del);

  const subBtn = document.createElement('button');
  subBtn.textContent = 'Open Asset Sub-Editor';
  subBtn.style.cssText = 'margin-top:8px;background:var(--acc);color:#14161a;border:none;font-weight:600;padding:5px 10px;cursor:pointer;';
  subBtn.addEventListener('click', () => openSubEditor(cat, idx));
  insp.append(subBtn);

  if (cat === 'buildings' || cat === 'landmarks' || cat === 'props') {
    const aeBtn = document.createElement('button');
    aeBtn.textContent = 'Open Full-Screen Asset Editor';
    aeBtn.style.cssText = 'margin-top:6px;background:#40e0ff;color:#14161a;border:none;font-weight:600;padding:5px 10px;cursor:pointer;width:100%;';
    aeBtn.addEventListener('click', () => openAssetEditor(cat, idx));
    insp.append(aeBtn);
  }

  renderIssues();
}
// ============ validation ============
function validate() {
  issues = [];
  const B = scene;
  const distPtSeg = (px, pz, ax, az, bx, bz) => {
    const dx = bx - ax, dz = bz - az, len2 = dx * dx + dz * dz;
    if (len2 < 1e-9) return Math.hypot(px - ax, pz - az);
    let t = ((px - ax) * dx + (pz - az) * dz) / len2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (ax + t * dx), pz - (az + t * dz));
  };
  const roadSeqs = [];
  for (const r of B.roads || []) {
    const pts = r.points || [];
    for (let i = 0; i < pts.length - 1; i++) roadSeqs.push({ a: pts[i], b: pts[i + 1], w: r.w || 12 });
    if (pts.length > 2 && pts[0][0] === pts[pts.length - 1][0] && pts[0][1] === pts[pts.length - 1][1]) {
      roadSeqs.push({ a: pts[pts.length - 1], b: pts[0], w: r.w || 12 });
    }
  }
  const distToRoad = (x, z) => {
    let best = 1e9;
    for (const s of roadSeqs) best = Math.min(best, distPtSeg(x, z, s.a[0], s.a[1], s.b[0], s.b[1]));
    return best;
  };
  const radius = (b) => Math.hypot(b.w || 12, b.d || 12) / 2;
  const buildings = [];
  for (let i = 0; i < (B.buildings || []).length; i++) {
    const b = B.buildings[i];
    buildings.push({ kind: b.kind || 'box', x: b.x, z: b.z, r: radius(b), cat: 'buildings', idx: i });
  }
  for (let i = 0; i < (B.landmarks || []).length; i++) {
    const lm = B.landmarks[i];
    const r = { warehouse: Math.hypot(lm.w || 34, lm.d || 22) / 2, trainstation: Math.hypot(24, 12) / 2, port: Math.hypot(20, 14) / 2, fuel: (lm.r || 3) * 1.5, policestation: Math.hypot(lm.w || 16, lm.d || 12) / 2, nightclub: Math.hypot(lm.w || 18, lm.d || 16) / 2, mall: Math.hypot(lm.w || 40, lm.d || 20) / 2, stadium: Math.hypot(lm.w || 82, lm.d || 57) / 2, mosque: Math.hypot(lm.w || 16, lm.d || 14) / 2, transit: 5 }[lm.kind];
    if (r) buildings.push({ kind: lm.kind, x: lm.x, z: lm.z, r, cat: 'landmarks', idx: i });
  }
  const locOf = (b) => loc(b.cat, b.idx, b.x, b.z);
  const minClear = 7;
  for (const b of buildings) {
    const clear = distToRoad(b.x, b.z) - b.r;
    if (clear < minClear) issues.push({ lvl: 'err', msg: `BUILDING ${b.kind}@(${b.x},${b.z}) ${clear.toFixed(1)}m from road centerline (r=${b.r.toFixed(0)})`, loc: locOf(b) });
  }
  for (let i = 0; i < buildings.length; i++) {
    for (let j = i + 1; j < buildings.length; j++) {
      const a = buildings[i], b = buildings[j];
      const d = Math.hypot(a.x - b.x, a.z - b.z);
      if (d < a.r + b.r - 1) issues.push({ lvl: 'err', msg: `OVERLAP ${a.kind}@(${a.x},${a.z}) vs ${b.kind}@(${b.x},${b.z}) gap ${(d - a.r - b.r).toFixed(1)}m`, loc: locOf(a) });
    }
  }
  const inside = (x, z, b) => Math.hypot(x - b.x, z - b.z) < b.r + 1.5;
  const lmSpots = (B.landmarks || []).map((l) => [l.x, l.z]);
  const loc = (cat, idx, x, z) => ({ cat, idx, x, z });
  const checkPts = (arr, label, skipRoad, objCat) => {
    for (let i = 0; i < (arr || []).length; i++) {
      const p = arr[i];
      const x = Array.isArray(p) ? p[0] : p.x, z = Array.isArray(p) ? p[1] : p.z;
      for (const b of buildings) {
        if (inside(x, z, b)) { issues.push({ lvl: 'err', msg: `${label} (${x},${z}) inside ${b.kind}@(${b.x},${b.z})`, loc: loc(objCat, i, x, z) }); break; }
      }
      if (!skipRoad) {
        const d = distToRoad(x, z);
        const nearLm = lmSpots.some(([lx, lz]) => Math.hypot(x - lx, z - lz) < 35);
        if (d > 70 && !nearLm) issues.push({ lvl: 'warn', msg: `${label} (${x},${z}) is ${d.toFixed(0)}m from any road`, loc: loc(objCat, i, x, z) });
      }
    }
  };
  checkPts(B.spawns, 'SPAWN', false, 'spawns');
  checkPts(B.loot, 'LOOT', true, 'loot');
  checkPts(B.cover, 'COVER', true, 'cover');
  for (let i = 0; i < (B.props || []).length; i++) {
    const p = B.props[i];
    for (const b of buildings) {
      if (inside(p.x, p.z, b)) {
        issues.push({ lvl: 'err', msg: `PROP ${p.kind}@(${p.x},${p.z}) inside ${b.kind}@(${b.x},${b.z})`, loc: loc('props', i, p.x, p.z) });
        break;
      }
    }
  }
  for (let i = 0; i < (B.trees || []).length; i++) {
    const t = B.trees[i];
    for (const b of buildings) {
      if (Math.hypot(t.x - b.x, t.z - b.z) < b.r - 2) { issues.push({ lvl: 'warn', msg: `TREE (${t.x},${t.z}) too close to ${b.kind}@(${b.x},${b.z})`, loc: loc('trees', i, t.x, t.z) }); break; }
    }
  }
  return issues;
}
function renderIssues() {
  const box = document.createElement('div');
  box.id = 'issues';
  box.innerHTML = '';
  if (issues.length === 0) {
    const ok = document.createElement('div');
    ok.className = 'note';
    ok.textContent = 'Validation: all clear';
    box.append(ok);
  } else {
    const h = document.createElement('h2');
    h.style.cssText = 'margin-top:8px';
    h.textContent = `${issues.length} issue${issues.length > 1 ? 's' : ''} — click to locate`;
    box.append(h);
    for (const is of issues) {
      const d = document.createElement('div');
      d.className = 'issue ' + is.lvl;
      d.textContent = is.msg;
      d.addEventListener('click', () => {
        view.cx = is.loc.x; view.cz = is.loc.z; view.scale = Math.max(view.scale, 4);
        if (is.loc.cat >= 0) { selected = { cat: is.loc.cat, idx: is.loc.idx }; }
        draw2d(); renderInspector();
      });
      box.append(d);
    }
  }
  const old = insp.querySelector('#issues');
  if (old) old.remove();
  insp.append(box);
}

// ============ asset sub-editor (merged into inspector) ============
let subEditorCat = null, subEditorIdx = null;
function openSubEditor(cat, idx) {
  subEditorCat = cat; subEditorIdx = idx;
}

// ============ full-screen asset editor ============
let aeRenderer = null, aeScene = null, aeCam = null, aeWorld = null;
let aeOrbit = { yaw: 0.8, pitch: 0.45, dist: 25 };
let aeTarget = new THREE.Vector3(0, 3, 0);
let aeItem = null, aeCat = null, aeIdx = null;
let aeOmouse = null;

function openAssetEditor(cat, idx) {
  const it = scene[cat] && scene[cat][idx];
  if (!it) return;
  aeItem = it; aeCat = cat; aeIdx = idx;
  const wrap = $('#assetEditor');
  wrap.style.display = 'flex';
  const name = it.kind || it.type || cat;
  $('#aeAssetName').textContent = `${name.toUpperCase()} — ${cat} #${idx}`;

  // init renderer if needed
  if (!aeRenderer) {
    const c = $('#aeCanvas3d');
    aeRenderer = new THREE.WebGLRenderer({ canvas: c, antialias: true });
    aeRenderer.shadowMap.enabled = true;
    aeCam = new THREE.PerspectiveCamera(50, 1, 0.1, 500);
  }
  resizeAssetEditor();

  // build scene with just this asset
  if (aeScene) disposeScene(aeScene);
  aeScene = new THREE.Scene();
  aeScene.add(new THREE.AmbientLight(0xffffff, 0.5));
  const dl = new THREE.DirectionalLight(0xffffff, 1);
  dl.position.set(20, 30, 20); dl.castShadow = true;
  aeScene.add(dl);
  const dl2 = new THREE.DirectionalLight(0x8888ff, 0.3);
  dl2.position.set(-15, 20, -10); aeScene.add(dl2);

  // build just the single asset
  const sd = JSON.parse(JSON.stringify(scene));
  sd.buildings = cat === 'buildings' ? [it] : [];
  sd.landmarks = cat === 'landmarks' ? [it] : [];
  sd.props = cat === 'props' ? [it] : [];
  sd.roads = []; sd.pads = []; sd.vehicles = []; sd.trees = [];
  sd.spawns = []; sd.cover = []; sd.loot = []; sd.transit = []; sd.named = [];
  sd.reactives = [];
  sd.startPoint = { x: 0, z: 0, yaw: 0 };
  try { aeWorld = new World(aeScene, 'high', sd); } catch (e) { console.warn(e); }

  aeTarget.set(it.x || 0, (it.h || 4) / 2, it.z || 0);
  aeOrbit.dist = Math.max(it.w || 12, it.d || 12) * 1.2;
  updateAeOrbit();
  renderAeControls();
}

function closeAssetEditor() {
  $('#assetEditor').style.display = 'none';
  if (aeScene) { disposeScene(aeScene); aeScene = null; }
  aeItem = null; aeCat = null; aeIdx = null;
}

function resizeAssetEditor() {
  if (!aeRenderer) return;
  const r = $('#aeView3d').getBoundingClientRect();
  if (!r.width) return;
  aeRenderer.setSize(r.width, r.height);
  aeCam.aspect = r.width / r.height;
  aeCam.updateProjectionMatrix();
}

function updateAeOrbit() {
  if (!aeCam) return;
  aeCam.position.set(
    aeTarget.x + aeOrbit.dist * Math.cos(aeOrbit.pitch) * Math.sin(aeOrbit.yaw),
    aeTarget.y + aeOrbit.dist * Math.sin(aeOrbit.pitch),
    aeTarget.z + aeOrbit.dist * Math.cos(aeOrbit.pitch) * Math.cos(aeOrbit.yaw));
  aeCam.lookAt(aeTarget);
}

function renderAeControls() {
  const props = $('#aeProps');
  const visual = $('#aeVisual');
  props.innerHTML = ''; visual.innerHTML = '';
  if (!aeItem) return;
  const it = aeItem;

  // basic properties
  const addNum = (label, val, cb) => {
    const row = document.createElement('div'); row.style.cssText = 'display:flex;align-items:center;gap:6px;margin:3px 0;';
    const lb = document.createElement('label'); lb.textContent = label; lb.style.cssText = 'color:var(--dim);font-size:12px;width:70px;flex-shrink:0;';
    const inp = document.createElement('input'); inp.type = 'number'; inp.value = val; inp.step = 0.5;
    inp.style.cssText = 'flex:1;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:3px;padding:3px 5px;';
    inp.addEventListener('change', () => cb(parseFloat(inp.value)));
    row.append(lb, inp); props.append(row);
  };
  const addText = (label, val, cb) => {
    const row = document.createElement('div'); row.style.cssText = 'display:flex;align-items:center;gap:6px;margin:3px 0;';
    const lb = document.createElement('label'); lb.textContent = label; lb.style.cssText = 'color:var(--dim);font-size:12px;width:70px;flex-shrink:0;';
    const inp = document.createElement('input'); inp.type = 'text'; inp.value = val || '';
    inp.style.cssText = 'flex:1;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:3px;padding:3px 5px;';
    inp.addEventListener('change', () => cb(inp.value));
    row.append(lb, inp); props.append(row);
  };

  if (it.x !== undefined) { addNum('X', it.x, (v) => { it.x = v; openAssetEditor(aeCat, aeIdx); }); }
  if (it.z !== undefined) { addNum('Z', it.z, (v) => { it.z = v; openAssetEditor(aeCat, aeIdx); }); }
  if (it.w !== undefined) addNum('Width', it.w, (v) => { it.w = v; openAssetEditor(aeCat, aeIdx); });
  if (it.d !== undefined) addNum('Depth', it.d, (v) => { it.d = v; openAssetEditor(aeCat, aeIdx); });
  if (it.h !== undefined) addNum('Height', it.h, (v) => { it.h = v; openAssetEditor(aeCat, aeIdx); });
  if (it.ry !== undefined) addNum('Rotation', it.ry, (v) => { it.ry = v; openAssetEditor(aeCat, aeIdx); });
  addText('Name', it.name, (v) => { it.name = v; });

  // visual overrides
  const addColor = (label, val, cb) => {
    const row = document.createElement('div'); row.style.cssText = 'display:flex;align-items:center;gap:6px;margin:3px 0;';
    const lb = document.createElement('label'); lb.textContent = label; lb.style.cssText = 'color:var(--dim);font-size:12px;width:70px;flex-shrink:0;';
    const ci = document.createElement('input'); ci.type = 'color'; ci.value = val || '#969696';
    ci.style.cssText = 'width:34px;height:24px;padding:0;border:1px solid var(--line);background:var(--panel2);';
    ci.addEventListener('input', () => cb(ci.value));
    row.append(lb, ci); visual.append(row);
  };
  const addSelect = (label, val, opts, cb) => {
    const row = document.createElement('div'); row.style.cssText = 'display:flex;align-items:center;gap:6px;margin:3px 0;';
    const lb = document.createElement('label'); lb.textContent = label; lb.style.cssText = 'color:var(--dim);font-size:12px;width:70px;flex-shrink:0;';
    const sel = document.createElement('select');
    sel.style.cssText = 'flex:1;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:3px;padding:3px 5px;';
    for (const [k, v] of Object.entries(opts)) {
      const o = document.createElement('option'); o.value = k; o.textContent = v;
      if (k === val) o.selected = true; sel.appendChild(o);
    }
    sel.addEventListener('change', () => cb(sel.value));
    row.append(lb, sel); visual.append(row);
  };

  addColor('Wall tint', it._tint || '#969696', (v) => { it._tint = v; openAssetEditor(aeCat, aeIdx); });
  addColor('Roof tint', it._roofTint || '#808080', (v) => { it._roofTint = v; openAssetEditor(aeCat, aeIdx); });
  addSelect('Wall mat', it.m || 'default', { default: 'Default', brick: 'Brick', wood: 'Wood', concrete: 'Concrete', panel: 'Panel', corrugated: 'Metal' }, (v) => { it.m = v === 'default' ? undefined : v; openAssetEditor(aeCat, aeIdx); });
  addSelect('Roof mat', it.roofM || 'default', { default: 'Default', shingle: 'Shingle', tile: 'Tile', metal: 'Metal' }, (v) => { it.roofM = v === 'default' ? undefined : v; openAssetEditor(aeCat, aeIdx); });

  // overlay text controls
  if (aeCat === 'buildings' || aeCat === 'landmarks') {
    const ovDiv = document.createElement('div'); ovDiv.style.cssText = 'margin-top:8px;padding-top:6px;border-top:1px solid var(--line);';
    ovDiv.innerHTML = '<div style="font-size:11px;color:var(--acc);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;">Text Overlays</div>';
    const overlays = it._overlays || [];
    overlays.forEach((ov, oi) => {
      const row = document.createElement('div'); row.style.cssText = 'display:flex;gap:4px;margin:2px 0;';
      const ti = document.createElement('input'); ti.type = 'text'; ti.value = ov.text; ti.style.cssText = 'flex:1;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:3px;padding:2px 4px;font-size:11px;';
      ti.addEventListener('change', () => { ov.text = ti.value; });
      const ci = document.createElement('input'); ci.type = 'color'; ci.value = ov.color || '#ffffff'; ci.style.cssText = 'width:24px;height:22px;padding:0;border:1px solid var(--line);';
      ci.addEventListener('input', () => { ov.color = ci.value; });
      const db = document.createElement('button'); db.textContent = '×'; db.style.cssText = 'background:var(--panel2);color:var(--err);border:1px solid var(--line);border-radius:3px;cursor:pointer;font-size:11px;padding:0 5px;';
      db.addEventListener('click', () => { overlays.splice(oi, 1); it._overlays = overlays; renderAeControls(); });
      row.append(ti, ci, db); ovDiv.append(row);
    });
    const addOvBtn = document.createElement('button'); addOvBtn.textContent = '+ Add overlay';
    addOvBtn.style.cssText = 'margin-top:4px;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:3px;padding:3px 8px;cursor:pointer;font-size:11px;';
    addOvBtn.addEventListener('click', () => {
      if (!it._overlays) it._overlays = [];
      it._overlays.push({ text: 'TEXT', color: '#ffffff', offX: 0, offZ: 0, fontSize: 1.0 });
      renderAeControls();
    });
    ovDiv.append(addOvBtn);
    visual.append(ovDiv);
  }
}

$('#aeClose').addEventListener('click', closeAssetEditor);
$('#aeApply').addEventListener('click', () => { closeAssetEditor(); redrawAll(); });

// open asset editor on double-click from library
// (also callable from inspector via button — see renderInspector)
window._openAssetEditor = openAssetEditor;

// 3D orbit in asset editor
$('#aeCanvas3d').addEventListener('mousedown', (e) => {
  aeOmouse = { x: e.clientX, y: e.clientY, b: e.button };
});
window.addEventListener('mousemove', (e) => {
  if (!aeOmouse || $('#assetEditor').style.display === 'none') return;
  const dx = e.clientX - aeOmouse.x, dy = e.clientY - aeOmouse.y;
  aeOmouse.x = e.clientX; aeOmouse.y = e.clientY;
  if (aeOmouse.b === 0) {
    aeOrbit.yaw -= dx * 0.005;
    aeOrbit.pitch = Math.max(0.05, Math.min(1.5, aeOrbit.pitch + dy * 0.005));
  } else if (aeOmouse.b === 2) {
    aeTarget.y += dy * 0.02;
  }
  updateAeOrbit();
});
$('#aeCanvas3d').addEventListener('mouseup', () => { aeOmouse = null; });
$('#aeCanvas3d').addEventListener('contextmenu', (e) => e.preventDefault());
$('#aeCanvas3d').addEventListener('wheel', (e) => {
  aeOrbit.dist = Math.max(3, Math.min(200, aeOrbit.dist * (e.deltaY > 0 ? 1.1 : 1 / 1.1)));
  updateAeOrbit();
}, { passive: true });

function animate() {
  requestAnimationFrame(animate);
  if (aeRenderer && aeScene && aeCam && $('#assetEditor').style.display === 'flex') {
    updateAeOrbit();
    aeRenderer.render(aeScene, aeCam);
  }
}
animate();

function disposeScene(sc) {
  sc.traverse((o) => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      const ms = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of ms) {
        m.dispose();
      }
    }
  });
}

// ============ save / load ============
function sceneFileName() { return (scene.id || 'map').replace(/[^\w-]/g, '_') + '.json'; }
let saveTimer = null;
function dirty() {
  clearTimeout(saveTimer);
  $('#saveState').textContent = 'Unsaved changes';
  saveTimer = setTimeout(() => save(true), 2500);
}
let lastBackupJson = null;
function backupIfNeeded() {
  const snap = JSON.stringify(scene);
  if (snap === lastBackupJson) return;
  lastBackupJson = snap;
}
async function save(silent) {
  clearTimeout(saveTimer);
  $('#saveState').textContent = 'Saving…';
  const name = sceneFileName();
  const data = JSON.stringify(scene, null, 2);
  try {
    const r = await fetch('/api/scene', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, data }),
    });
    const j = await r.json();
    if (r.ok) backupIfNeeded();
    $('#saveState').textContent = r.ok ? (silent ? 'Autosaved ' : 'Saved ') + name : 'Save failed: ' + (j.error || r.status);
    refreshList();
  } catch (err) {
    $('#saveState').textContent = 'Save failed: ' + err.message;
  }
}
$('#btnSave').addEventListener('click', () => save());
$('#btnDelete').addEventListener('click', async () => {
  const name = $('#sceneList').value;
  if (!name) return;
  if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;
  try {
    await fetch('/api/scene?name=' + encodeURIComponent(name), { method: 'DELETE' });
    $('#status').textContent = `Deleted ${name}`;
    refreshList();
  } catch (err) { $('#status').textContent = 'Delete failed: ' + err.message; }
});
$('#btnNew').addEventListener('click', () => { if (!confirm('Create new map? Unsaved changes will be lost.')) return; scene = normalizeScene(newScene()); selected = null; roadDraft = null; camResetNeeded = true; fitView(); redrawAll(); });
async function refreshList() {
  try {
    const r = await fetch('/api/scenes');
    const files = (await r.json()).filter(f => !f.endsWith('.bak'));
    const sel = $('#sceneList');
    const prev = sel.value;
    sel.innerHTML = files.map((f) => `<option ${f === prev ? 'selected' : ''}>${f}</option>`).join('');
  } catch (e) { /* offline */ }
}
$('#btnLoad').addEventListener('click', async () => {
  const name = $('#sceneList').value;
  if (!name) return;
  if (!confirm(`Load "${name}"? Unsaved changes will be lost.`)) return;
  try {
    const r = await fetch('/api/scene?name=' + encodeURIComponent(name));
    scene = normalizeScene(await r.json());
    scene.id = name.replace('.json', '');
    selected = null; roadDraft = null;
    fitView(); redrawAll();
    $('#status').textContent = `Loaded ${name}`;
  } catch (err) { $('#status').textContent = 'Load failed: ' + err.message; }
});
$('#btnValidate').addEventListener('click', () => { validate(); renderInspector(); $('#status').textContent = issues.length ? `${issues.length} issues` : 'All clear'; });
$('#btnOpenGame').addEventListener('click', () => { save().then(() => { window.open('/?scene=' + sceneFileName(), '_blank'); }); });
$('#btnFit').addEventListener('click', () => { fitView(); });

function redrawAll() { draw2d(); renderInspector(); if (view3d) build3dScene(); dirty(); }
window.addEventListener('resize', () => { resize2d(); resizeAssetEditor(); resize3d(); });

// ============ 3D EDITOR MODE ============
let view3d = false;
let r3d = null, scene3d = null, cam3d = null, world3d = null;
let orbit3d = { yaw: 0.8, pitch: 0.5, dist: 120, target: new THREE.Vector3(0, 0, 0) };
let mouse3d = { down: false, b: 0, lx: 0, ly: 0 };

function toggle3d() {
  view3d = !view3d;
  $('#pane2d').classList.toggle('hidden', view3d);
  $('#pane3d').classList.toggle('active', view3d);
  $('#viewToggle').textContent = view3d ? '2D' : '3D';
  $('#viewToggle').classList.toggle('active', view3d);
  if (view3d) init3d(); else destroy3d();
  resize2d(); resize3d();
}
$('#viewToggle').addEventListener('click', toggle3d);

function init3d() {
  if (r3d) return;
  const c = $('#canvas3d');
  r3d = new THREE.WebGLRenderer({ canvas: c, antialias: true, powerPreference: 'high-performance' });
  r3d.shadowMap.enabled = true;
  r3d.shadowMap.type = THREE.PCFSoftShadowMap;
  r3d.toneMapping = THREE.ACESFilmicToneMapping;
  r3d.toneMappingExposure = 1.0;
  r3d.outputColorSpace = THREE.SRGBColorSpace;
  scene3d = new THREE.Scene();
  scene3d.background = new THREE.Color(0x87CEEB);
  scene3d.fog = new THREE.FogExp2(0x9aa8c8, 0.003);
  cam3d = new THREE.PerspectiveCamera(60, 1, 0.5, 5000);

  const amb = new THREE.AmbientLight(0xffffff, 0.5);
  scene3d.add(amb);
  const sun = new THREE.DirectionalLight(0xfff4dd, 2.5);
  sun.position.set(200, 300, 100);
  sun.castShadow = true;
  const S = 300;
  Object.assign(sun.shadow.camera, { left: -S, right: S, top: S, bottom: -S, near: 10, far: 800 });
  sun.shadow.mapSize.setScalar(2048);
  sun.shadow.bias = -0.001;
  scene3d.add(sun);
  const hemi = new THREE.HemisphereLight(0xcfe3ff, 0x6a6c60, 1.0);
  scene3d.add(hemi);

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(scene.ground?.size || 2600, scene.ground?.size || 2600),
    new THREE.MeshStandardMaterial({ color: scene.ground?.color || 0x4a3a2a, roughness: 0.95 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene3d.add(ground);

  build3dScene();
  resize3d();
  updateOrbit3d();
}

function build3dScene() {
  if (!scene3d) return;
  while (scene3d.children.length > 3) scene3d.remove(scene3d.children[scene3d.children.length - 1]);

  for (const b of scene.buildings || []) {
    const w = b.w || 12, d = b.d || 12, h = b.h || 4;
    const m = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, d),
      new THREE.MeshStandardMaterial({ color: 0x827870, roughness: 0.85 })
    );
    m.position.set(b.x, h / 2, b.z);
    m.rotation.y = b.ry || 0;
    m.castShadow = true; m.receiveShadow = true;
    scene3d.add(m);
  }

  for (const p of scene.pads || []) {
    const m = new THREE.Mesh(
      new THREE.BoxGeometry(p.w, 0.2, p.d),
      new THREE.MeshStandardMaterial({ color: 0x9a958c, roughness: 0.9 })
    );
    m.position.set(p.x, 0.1, p.z);
    m.rotation.y = p.ry || 0;
    m.receiveShadow = true;
    scene3d.add(m);
  }

  for (const t of scene.trees || []) {
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.2, 0.3, 3),
      new THREE.MeshStandardMaterial({ color: 0x6a5040 })
    );
    trunk.position.set(t.x, 1.5, t.z);
    scene3d.add(trunk);
    const leaves = new THREE.Mesh(
      new THREE.SphereGeometry(2 * (t.s || 1)),
      new THREE.MeshStandardMaterial({ color: t.dead ? 0x6a5a3a : 0x3a6a3a })
    );
    leaves.position.set(t.x, 4, t.z);
    scene3d.add(leaves);
  }

  for (const v of scene.vehicles || []) {
    const el = v.elevation || 0;
    const sz = { car: [2, 1.2, 4.5], truck: [2.5, 1.8, 5.5], jeep: [2.2, 1.5, 4.5] }[v.kind] || [2, 1.2, 4.5];
    const m = new THREE.Mesh(
      new THREE.BoxGeometry(sz[0], sz[1], sz[2]),
      new THREE.MeshStandardMaterial({ color: { car: 0xc06060, truck: 0x6080b0, jeep: 0x70a060 }[v.kind] || 0xc06060, roughness: 0.4, metalness: 0.6 })
    );
    m.position.set(v.x, el + sz[1] / 2, v.z);
    m.rotation.y = v.ry || 0;
    m.castShadow = true;
    scene3d.add(m);
  }

  for (const r of scene.roads || []) {
    const pts = r.points || [];
    if (pts.length < 2) continue;
    const drawPts = r.smooth !== false ? smoothRoadPoints(pts, 6) : pts;
    const w = (r.w || 12) / 2;
    for (let i = 0; i < drawPts.length - 1; i++) {
      const [x1, z1] = drawPts[i], [x2, z2] = drawPts[i + 1];
      const dx = x2 - x1, dz = z2 - z1;
      const len = Math.hypot(dx, dz);
      if (len < 0.1) continue;
      const nx = -dz / len, nz = dx / len;
      const shape = new THREE.Shape();
      shape.moveTo(-w, 0); shape.lineTo(w, 0); shape.lineTo(w, len); shape.lineTo(-w, len); shape.closePath();
      const geo = new THREE.ShapeGeometry(shape);
      const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0x3d3d3d, roughness: 0.9 }));
      m.rotation.x = -Math.PI / 2;
      const mx = (x1 + x2) / 2, mz = (z1 + z2) / 2;
      const angle = Math.atan2(dx, dz);
      m.position.set(mx, 0.05, mz);
      m.rotation.z = -angle;
      m.receiveShadow = true;
      scene3d.add(m);
    }
  }

  for (const g of scene.glbAssets || []) {
    const sz = [3, 3, 3];
    const col = 0x60c0e0;
    const m = new THREE.Mesh(
      new THREE.BoxGeometry(sz[0], sz[1], sz[2]),
      new THREE.MeshStandardMaterial({ color: col, roughness: 0.7, transparent: true, opacity: 0.6 })
    );
    const elev = g.elevation || 0;
    m.position.set(g.x, elev + sz[1] / 2, g.z);
    m.rotation.y = g.ry || 0;
    m.castShadow = true;
    scene3d.add(m);
    if (g.url) {
      const lbl = g.name || g.url.split('/').pop().split('.')[0];
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0, 0, 256, 64);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 20px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(lbl.substring(0, 24), 128, 40);
      const tex = new THREE.CanvasTexture(canvas);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
      sprite.position.set(g.x, elev + sz[1] + 2, g.z);
      sprite.scale.set(8, 2, 1);
      scene3d.add(sprite);
    }
  }

  const sp = scene.startPoint;
  if (sp) {
    const marker = new THREE.Mesh(
      new THREE.CylinderGeometry(0.5, 0.5, 2),
      new THREE.MeshStandardMaterial({ color: 0x40e0ff, emissive: 0x40e0ff, emissiveIntensity: 0.5 })
    );
    marker.position.set(sp.x, 1, sp.z);
    scene3d.add(marker);
  }
}

function destroy3d() {
  if (scene3d) { scene3d.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) { const ms = Array.isArray(o.material) ? o.material : [o.material]; for (const m of ms) m.dispose(); } }); }
  scene3d = null; cam3d = null; world3d = null;
  if (r3d) { r3d.dispose(); r3d = null; }
}

function resize3d() {
  if (!r3d || !view3d) return;
  const r = $('#pane3d').getBoundingClientRect();
  if (!r.width) return;
  r3d.setSize(r.width, r.height);
  cam3d.aspect = r.width / r.height;
  cam3d.updateProjectionMatrix();
}

function updateOrbit3d() {
  if (!cam3d) return;
  const o = orbit3d;
  cam3d.position.set(
    o.target.x + o.dist * Math.cos(o.pitch) * Math.sin(o.yaw),
    o.target.y + o.dist * Math.sin(o.pitch),
    o.target.z + o.dist * Math.cos(o.pitch) * Math.cos(o.yaw)
  );
  cam3d.lookAt(o.target);
}

$('#canvas3d').addEventListener('mousedown', (e) => { mouse3d = { down: true, b: e.button, lx: e.clientX, ly: e.clientY }; });
window.addEventListener('mousemove', (e) => {
  if (!mouse3d.down || !view3d) return;
  const dx = e.clientX - mouse3d.lx, dy = e.clientY - mouse3d.ly;
  mouse3d.lx = e.clientX; mouse3d.ly = e.clientY;
  if (mouse3d.b === 0) {
    orbit3d.yaw -= dx * 0.005;
    orbit3d.pitch = Math.max(0.05, Math.min(1.5, orbit3d.pitch + dy * 0.005));
  } else if (mouse3d.b === 2 || mouse3d.b === 1) {
    const right = new THREE.Vector3();
    const fwd = new THREE.Vector3();
    cam3d.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();
    right.crossVectors(fwd, new THREE.Vector3(0, 1, 0)).normalize();
    orbit3d.target.addScaledVector(right, -dx * 0.1);
    orbit3d.target.y += dy * 0.1;
  }
  updateOrbit3d();
});
$('#canvas3d').addEventListener('mouseup', () => { mouse3d.down = false; });
$('#canvas3d').addEventListener('contextmenu', (e) => e.preventDefault());
$('#canvas3d').addEventListener('wheel', (e) => {
  e.preventDefault();
  orbit3d.dist = Math.max(5, Math.min(800, orbit3d.dist * (e.deltaY > 0 ? 1.1 : 1 / 1.1)));
  updateOrbit3d();
}, { passive: false });

function anim3d() {
  requestAnimationFrame(anim3d);
  if (r3d && scene3d && cam3d && view3d) {
    r3d.render(scene3d, cam3d);
    const p = cam3d.position;
    const el = $('#coords3d');
    if (el) el.textContent = `x:${p.x.toFixed(0)} y:${p.y.toFixed(0)} z:${p.z.toFixed(0)}`;
  }
}
anim3d();

refreshList();
renderLibrary();
// boot
resize2d();
fitView();
renderInspector();
const qm = new URLSearchParams(location.search).get('map');
if (qm) {
  (async () => {
    try {
      const r = await fetch('/api/scene?name=' + encodeURIComponent(qm));
      scene = normalizeScene(await r.json());
      scene.id = qm.replace('.json', '');
      selected = null; roadDraft = null;
      fitView(); redrawAll();
    } catch (err) { console.error('boot map load failed', err); }
  })();
}
</script>
</body>
</html>
