<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAP EDITOR — Strike Command</title>
<style>
  :root { --bg:#0f1115; --panel:#181c22; --panel2:#1f242c; --panel3:#272d36; --line:#2a303a; --txt:#d4d9e0; --dim:#6b7680; --acc:#ffd24a; --ok:#59c06a; --err:#e06050; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--txt); font:13px/1.4 "Segoe UI",system-ui,sans-serif; display:flex; overflow:hidden; }

  /* LEFT TOOL RAIL */
  #toolrail { width:56px; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; align-items:center; padding:6px 0; gap:2px; z-index:10; flex-shrink:0; }
  #toolrail .logo { font-size:10px; font-weight:700; color:var(--acc); letter-spacing:1px; padding:6px 0 8px; text-align:center; width:100%; border-bottom:1px solid var(--line); margin-bottom:4px; }
  #toolrail button { width:40px; height:40px; background:none; border:none; color:var(--dim); border-radius:8px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; font-size:9px; transition:background .12s,color .12s; }
  #toolrail button svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  #toolrail button:hover { background:var(--panel2); color:var(--txt); }
  #toolrail button.active { background:rgba(255,210,74,.12); color:var(--acc); }
  #toolrail .rail-sep { width:28px; height:1px; background:var(--line); margin:4px 0; }

  /* CENTER AREA */
  #center { flex:1; display:flex; flex-direction:column; min-width:0; }

  /* TOP BAR */
  #topbar { display:flex; align-items:center; gap:10px; padding:6px 14px; background:var(--panel); border-bottom:1px solid var(--line); flex-shrink:0; min-height:42px; }
  #topbar .file-group { display:flex; align-items:center; gap:4px; }
  #topbar select, #topbar input[type=text] { background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:5px; padding:4px 8px; font-size:12px; }
  #topbar button { background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:5px; padding:5px 12px; cursor:pointer; font-size:12px; transition:all .12s; }
  #topbar button:hover { border-color:var(--acc); color:var(--acc); }
  #topbar button.primary { background:var(--acc); color:#111; border-color:var(--acc); font-weight:600; }
  #topbar button.primary:hover { background:#ffe060; }
  #topbar .sep { width:1px; height:22px; background:var(--line); }
  #topbar .spacer { flex:1; }
  #topbar .status-group { display:flex; align-items:center; gap:8px; }
  #saveState { color:var(--ok); font-size:11px; }
  #status { color:var(--dim); font-size:11px; }
  #topbar label { color:var(--dim); font-size:11px; display:flex; align-items:center; gap:4px; }
  #topbar select { padding:3px 6px; }

  /* TOOL OPTIONS BAR */
  #toolopts { display:flex; align-items:center; gap:8px; padding:5px 14px; background:var(--panel); border-bottom:1px solid var(--line); flex-shrink:0; min-height:34px; flex-wrap:wrap; }
  #toolopts label { color:var(--dim); font-size:11px; display:flex; align-items:center; gap:4px; }
  #toolopts input[type=number] { width:52px; background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:4px; padding:2px 5px; font-size:11px; }
  #toolopts input[type=checkbox] { accent-color:var(--acc); }
  #toolopts select { background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:4px; padding:2px 5px; font-size:11px; }
  #toolopts .opt-sep { width:1px; height:16px; background:var(--line); }
  #kindLabel { display:none; }

  /* MAIN CANVAS AREA */
  #canvas-area { flex:1; display:flex; min-height:0; position:relative; }
  #pane2d { flex:1; position:relative; min-width:200px; }
  #canvas2d { position:absolute; inset:0; width:100%; height:100%; display:block; background:#0c0e11; cursor:crosshair; }
  #pane3d { width:45%; min-width:280px; display:flex; flex-direction:column; border-left:1px solid var(--line); }
  #view3d { flex:1; min-height:0; position:relative; background:#0c0e11; }
  #canvas3d { position:absolute; inset:0; width:100%; height:100%; display:block; }

  /* OVERLAYS */
  #coords { position:absolute; left:10px; bottom:8px; color:var(--dim); font-size:11px; background:rgba(0,0,0,.6); padding:3px 8px; border-radius:4px; pointer-events:none; }
  #hint { position:absolute; right:10px; bottom:8px; color:#4a5158; font-size:11px; pointer-events:none; }
  #legend { position:absolute; left:50%; bottom:8px; transform:translateX(-50%); background:rgba(0,0,0,.65); border:1px solid var(--line); border-radius:5px; padding:5px 10px; display:none; font-size:11px; color:var(--dim); pointer-events:none; z-index:2; max-width:85%; }
  #legend.show { display:flex; flex-wrap:wrap; gap:4px 12px; }
  #legend .lg { display:flex; align-items:center; gap:4px; }
  #legend .lg i { width:8px; height:8px; border-radius:2px; display:inline-block; }

  /* RIGHT PANEL (Inspector + Library) */
  #rightpanel { width:280px; background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; flex-shrink:0; overflow:hidden; }
  #rightpanel .rp-header { padding:8px 12px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:6px; flex-shrink:0; }
  #rightpanel .rp-header h2 { font-size:11px; color:var(--acc); text-transform:uppercase; letter-spacing:1px; flex:1; }
  #rightpanel .rp-header button { background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:4px; padding:2px 7px; cursor:pointer; font-size:10px; }
  #rightpanel .rp-header button:hover { border-color:var(--acc); color:var(--acc); }
  #insp { flex:1; overflow:auto; padding:8px 12px; }
  #insp h2 { font-size:11px; color:var(--acc); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
  #insp .row { display:flex; align-items:center; gap:6px; margin:3px 0; }
  #insp .row label { width:72px; color:var(--dim); font-size:11px; flex-shrink:0; }
  #insp .row input[type=number], #insp .row input[type=text], #insp .row select { flex:1; min-width:0; background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:4px; padding:3px 6px; font-size:12px; }
  #insp .row input[type=checkbox] { width:auto; accent-color:var(--acc); }
  #insp .row input[type=color] { width:30px; height:22px; padding:0; border:1px solid var(--line); background:var(--panel2); border-radius:3px; }
  #insp .row input:disabled { opacity:.4; }
  #insp .section { margin-top:8px; padding-top:6px; border-top:1px solid var(--line); }
  #insp .note { color:var(--dim); font-size:11px; }
  #insp button.primary { background:var(--acc); color:#14161a; border:none; font-weight:600; padding:5px 12px; border-radius:4px; cursor:pointer; }
  #issues { margin-top:8px; }
  #issues .issue { padding:3px 6px; border-radius:3px; font-size:11px; margin:2px 0; cursor:pointer; }
  #issues .issue.err { background:rgba(224,96,80,.12); color:#f0a090; }
  #issues .issue.warn { background:rgba(255,210,74,.1); color:#e8cf8a; }

  /* ASSET LIBRARY (collapsible in right panel) */
  #library { border-top:1px solid var(--line); display:flex; flex-direction:column; max-height:45%; min-height:0; flex-shrink:0; }
  #library.collapsed { max-height:32px; min-height:32px; }
  #library.collapsed .lib-body { display:none; }
  #library .lib-h { display:flex; align-items:center; gap:6px; padding:6px 12px; border-bottom:1px solid var(--line); flex-shrink:0; cursor:pointer; }
  #library .lib-h h2 { font-size:11px; color:var(--acc); text-transform:uppercase; letter-spacing:1px; }
  #library .lib-h button { background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:4px; padding:2px 6px; cursor:pointer; font-size:10px; }
  #libCount { margin-left:auto; color:var(--dim); font-size:10px; }
  #library .lib-body { flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
  #libSearch { width:100%; background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:4px; padding:4px 8px; font-size:11px; margin:6px 8px 0; width:calc(100% - 16px); }
  #libGrid { flex:1; overflow:auto; padding:4px 8px 8px; }
  .lib-cat { margin-bottom:6px; }
  .lib-cat-h { font-size:9px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; margin:4px 0 3px; }
  .lib-grid { display:flex; flex-wrap:wrap; gap:3px; }
  .tile { display:flex; align-items:center; gap:5px; background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:4px; padding:3px 6px; cursor:pointer; font-size:11px; transition:all .1s; }
  .tile:hover { border-color:var(--acc); color:var(--acc); }
  .tile.active { border-color:var(--acc); background:rgba(255,210,74,.12); color:var(--acc); }
  .tile .sw { width:8px; height:8px; border-radius:2px; flex-shrink:0; }

  /* ASSET EDITOR (fullscreen overlay) */
  #assetEditor { display:none; position:fixed; inset:0; z-index:100; background:#0c0e11; flex-direction:column; }

  /* FULLSCREEN 3D MODE */
  body.fullscreen3d #toolrail, body.fullscreen3d #topbar, body.fullscreen3d #toolopts, body.fullscreen3d #rightpanel { display:none !important; }
  body.fullscreen3d #center { flex:1; }
  body.fullscreen3d #canvas-area { flex:1; }
  body.fullscreen3d #pane2d { display:none; }
  body.fullscreen3d #pane3d { width:100%; border-left:none; }
  #float-toolbar { display:none; position:fixed; left:12px; top:50%; transform:translateY(-50%); z-index:50; background:rgba(24,28,34,.92); backdrop-filter:blur(8px); border:1px solid var(--line); border-radius:12px; padding:6px; flex-direction:column; gap:2px; }
  body.fullscreen3d #float-toolbar { display:flex; }
  #float-inspector { display:none; position:fixed; right:12px; top:50%; transform:translateY(-50%); z-index:50; background:rgba(24,28,34,.92); backdrop-filter:blur(8px); border:1px solid var(--line); border-radius:12px; padding:10px; width:220px; max-height:70vh; overflow-y:auto; color:var(--txt); font-size:12px; }
  body.fullscreen3d #float-inspector.has-sel { display:block; }
  #float-inspector h4 { margin:0 0 6px; font-size:13px; color:var(--acc); }
  #float-inspector label { display:block; margin:3px 0 1px; color:var(--dim); font-size:10px; text-transform:uppercase; letter-spacing:.5px; }
  #float-inspector input, #float-inspector select { width:100%; box-sizing:border-box; background:rgba(255,255,255,.06); border:1px solid var(--line); border-radius:4px; color:var(--txt); padding:4px 6px; font-size:12px; }
  #float-inspector .fi-row { display:flex; gap:4px; }
  #float-inspector .fi-row input { flex:1; }
  #float-inspector .fi-btn { margin-top:6px; padding:4px 8px; background:rgba(255,255,255,.08); border:1px solid var(--line); border-radius:4px; color:var(--txt); cursor:pointer; font-size:11px; }
  #float-toolbar button { width:42px; height:42px; background:none; border:none; color:var(--dim); border-radius:8px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; font-size:9px; transition:background .12s,color .12s; }
  #float-toolbar button svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  #float-toolbar button:hover { background:rgba(255,255,255,.08); color:var(--txt); }
  #float-toolbar button.active { background:rgba(255,210,74,.15); color:var(--acc); }
  #float-toolbar .ft-sep { width:28px; height:1px; background:var(--line); margin:2px auto; }
  #float-exit { position:fixed; top:12px; right:12px; z-index:50; background:rgba(24,28,34,.9); backdrop-filter:blur(8px); border:1px solid var(--line); border-radius:8px; padding:6px 14px; color:var(--txt); cursor:pointer; font-size:12px; display:none; }
  body.fullscreen3d #float-exit { display:block; }
  #float-exit:hover { border-color:var(--acc); color:var(--acc); }
  #float-coords { position:fixed; left:12px; bottom:12px; z-index:50; color:var(--dim); font-size:11px; background:rgba(0,0,0,.6); padding:3px 8px; border-radius:4px; display:none; pointer-events:none; }
  body.fullscreen3d #float-coords { display:block; }
  #float-hint { position:fixed; right:12px; bottom:12px; z-index:50; color:#4a5158; font-size:11px; display:none; pointer-events:none; }
  body.fullscreen3d #float-hint { display:block; }
</style>
</head>
<body>
<!-- LEFT TOOL RAIL -->
<div id="toolrail">
  <div class="logo">MAP</div>
  <button data-tool="select" class="active" title="Select / move"><svg><path d="M3 3l7 18 3-8 8-3z"/></svg><span>Sel</span></button>
  <button data-tool="road" title="Draw road"><svg><path d="M2 20 C8 12, 16 12, 22 20"/><path d="M2 16 C8 8, 16 8, 22 16"/></svg><span>Road</span></button>
  <button data-tool="pad" title="Place pad"><svg><rect x="3" y="3" width="18" height="18" rx="2"/></svg><span>Pad</span></button>
  <button data-tool="building" title="Place building"><svg><path d="M3 21V7l9-4 9 4v14"/><path d="M9 21v-6h6v6"/></svg><span>Bldg</span></button>
  <button data-tool="prop" title="Place prop"><svg><rect x="5" y="5" width="14" height="14" rx="3"/><circle cx="12" cy="12" r="3"/></svg><span>Prop</span></button>
  <button data-tool="vehicle" title="Place vehicle"><svg><rect x="2" y="8" width="20" height="8" rx="3"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg><span>Car</span></button>
  <button data-tool="landmark" title="Place landmark"><svg><path d="M12 2l8 18H4z"/></svg><span>Lmrk</span></button>
  <div class="rail-sep"></div>
  <button data-tool="text" title="Add text sign"><svg><path d="M4 7V4h16v3"/><path d="M12 4v16"/><path d="M8 20h8"/></svg><span>Text</span></button>
  <button data-tool="tree" title="Plant tree"><svg><circle cx="12" cy="8" r="5"/><path d="M12 13v8"/></svg><span>Tree</span></button>
  <button data-tool="spawn" title="Enemy spawn"><svg><circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/></svg><span>Spawn</span></button>
  <button data-tool="cover" title="Cover point"><svg><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 12h8"/></svg><span>Cover</span></button>
  <button data-tool="loot" title="Loot drop"><svg><path d="M12 2l6 6-6 6-6-6z"/><path d="M12 14v8"/></svg><span>Loot</span></button>
  <button data-tool="startpoint" title="Player start"><svg><polygon points="12,2 15,10 12,8 9,10"/><path d="M12 10v12"/></svg><span>Start</span></button>
  <div class="rail-sep"></div>
  <button data-tool="erase" title="Delete object"><svg><path d="M4 7h16"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M5 7l1 12a2 2 0 002 2h8a2 2 0 002-2l1-12"/><path d="M9 7V4h6v3"/></svg><span>Del</span></button>
</div>

<!-- CENTER -->
<div id="center">
  <!-- TOP BAR -->
  <div id="topbar">
    <div class="file-group">
      <select id="sceneList" title="Scene files"></select>
      <button id="btnLoad">Load</button>
      <button id="btnNew">New</button>
      <button id="btnSave">Save</button>
      <button id="btnDelete" title="Delete selected map file" style="color:var(--err);">Del</button>
    </div>
    <div class="sep"></div>
    <button id="btnValidate">Validate</button>
    <button id="btnOpenGame" class="primary">Play</button>
    <div class="sep"></div>
    <label>Quality <select id="previewQ"><option>high</option><option>low</option><option>ultra-low</option></select></label>
    <label><input type="checkbox" id="autoPreview" checked> Auto</label>
    <button id="btnRebuild">Rebuild 3D</button>
    <button id="btnFit">Fit</button>
    <button id="btnFullscreen3d" title="Toggle fullscreen 3D editing mode">3D Full</button>
    <div class="spacer"></div>
    <div class="status-group">
      <span id="saveState"></span>
      <span id="status"></span>
    </div>
  </div>

  <!-- TOOL OPTIONS -->
  <div id="toolopts">
    <label id="kindLabel" style="display:none">Kind <select id="kindSel"></select></label>
    <label>W <input type="number" id="roadW" value="12" min="4" max="40" step="1"></label>
    <label><input type="checkbox" id="roadSidewalk" checked> Walk</label>
    <label><input type="checkbox" id="roadSmooth" checked> Smooth</label>
    <div class="opt-sep"></div>
    <label>Pad W <input type="number" id="padW" value="20" min="4" step="1"></label>
    <label>D <input type="number" id="padD" value="14" min="4" step="1"></label>
    <div class="opt-sep"></div>
    <label><input type="checkbox" id="showGrid" checked> Grid</label>
  </div>

  <!-- CANVAS AREA -->
  <div id="canvas-area">
    <div id="pane2d">
      <canvas id="canvas2d"></canvas>
      <div id="coords"></div>
      <div id="hint">Select + drag blue ring=rotate · gold corners=resize · Q/E=rotate · Del=delete</div>
      <div id="legend"></div>
    </div>
    <div id="pane3d">
      <div id="view3d"><canvas id="canvas3d"></canvas></div>
    </div>
  </div>
</div>

<!-- RIGHT PANEL -->
<div id="rightpanel">
  <div id="insp"></div>
  <div id="library">
    <div class="lib-h"><h2>Assets</h2><span id="libCount"></span><button id="libToggle">−</button></div>
    <div class="lib-body">
      <input id="libSearch" type="text" placeholder="Search...">
      <div id="libGrid"></div>
    </div>
  </div>
</div>

<!-- FLOATING TOOLBAR (fullscreen 3D) -->
<div id="float-toolbar">
  <button data-tool="select" class="active" title="Select"><svg><path d="M3 3l7 18 3-8 8-3z"/></svg><span>Sel</span></button>
  <button data-tool="road" title="Road"><svg><path d="M2 20 C8 12, 16 12, 22 20"/><path d="M2 16 C8 8, 16 8, 22 16"/></svg><span>Road</span></button>
  <button data-tool="pad" title="Pad"><svg><rect x="3" y="3" width="18" height="18" rx="2"/></svg><span>Pad</span></button>
  <button data-tool="building" title="Building"><svg><path d="M3 21V7l9-4 9 4v14"/><path d="M9 21v-6h6v6"/></svg><span>Bldg</span></button>
  <button data-tool="prop" title="Prop"><svg><rect x="5" y="5" width="14" height="14" rx="3"/><circle cx="12" cy="12" r="3"/></svg><span>Prop</span></button>
  <button data-tool="vehicle" title="Vehicle"><svg><rect x="2" y="8" width="20" height="8" rx="3"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg><span>Car</span></button>
  <button data-tool="text" title="Text"><svg><path d="M4 7V4h16v3"/><path d="M12 4v16"/><path d="M8 20h8"/></svg><span>Text</span></button>
  <div class="ft-sep"></div>
  <button data-tool="tree" title="Tree"><svg><circle cx="12" cy="8" r="5"/><path d="M12 13v8"/></svg><span>Tree</span></button>
  <button data-tool="spawn" title="Spawn"><svg><circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/></svg><span>Spawn</span></button>
  <button data-tool="cover" title="Cover"><svg><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 12h8"/></svg><span>Cover</span></button>
  <button data-tool="loot" title="Loot"><svg><path d="M12 2l6 6-6 6-6-6z"/><path d="M12 14v8"/></svg><span>Loot</span></button>
  <button data-tool="startpoint" title="Start"><svg><polygon points="12,2 15,10 12,8 9,10"/><path d="M12 10v12"/></svg><span>Start</span></button>
  <div class="ft-sep"></div>
  <button data-tool="erase" title="Delete"><svg><path d="M4 7h16"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M5 7l1 12a2 2 0 002 2h8a2 2 0 002-2l1-12"/><path d="M9 7V4h6v3"/></svg><span>Del</span></button>
</div>
<button id="float-exit">Exit 3D</button>
<div id="float-coords"></div>
<div id="float-hint">Click=select · Drag=move · Q/E=rotate · Scroll=zoom · Middle-click=pan</div>
<div id="float-inspector"></div>

<div id="assetEditor" style="display:none;position:fixed;inset:0;z-index:100;background:#0c0e11;flex-direction:column;">
  <div style="display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);">
    <h2 style="font-size:13px;color:var(--acc);font-weight:600;">ASSET EDITOR</h2>
    <span id="aeAssetName" style="color:var(--dim);font-size:12px;"></span>
    <button id="aeClose" style="margin-left:auto;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:4px;padding:4px 12px;cursor:pointer;">Close [Esc]</button>
  </div>
  <div style="flex:1;display:flex;min-height:0;">
    <div id="aeView3d" style="flex:1;position:relative;background:#0c0e11;">
      <canvas id="aeCanvas3d" style="position:absolute;inset:0;width:100%;height:100%;display:block;"></canvas>
    </div>
    <div id="aeControls" style="width:280px;background:var(--panel);border-left:1px solid var(--line);padding:10px;overflow:auto;">
      <h3 style="font-size:11px;color:var(--acc);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;">Properties</h3>
      <div id="aeProps"></div>
      <h3 style="font-size:11px;color:var(--acc);text-transform:uppercase;letter-spacing:1px;margin:12px 0 8px;">Visual Overrides</h3>
      <div id="aeVisual"></div>
      <div style="margin-top:12px;">
        <button id="aeApply" class="primary" style="width:100%;padding:6px;background:var(--acc);color:#14161a;border:none;border-radius:4px;cursor:pointer;font-weight:600;">Apply & Close</button>

function updateFloatInspector() {
  const fi = $('#float-inspector');
  if (!fs3d || !selected) { fi.classList.remove('has-sel'); fi.innerHTML = ''; return; }
  fi.classList.add('has-sel');
  const { cat, idx } = selected;
  const it = scene[cat][idx];
  let html = `<h4>${catLabel[cat]}</h4>`;
  const num = (label, val, key) => `<label>${label}</label><input type="number" step="any" data-key="${key}" value="${val}">`;
  const txt = (label, val, key) => `<label>${label}</label><input type="text" data-key="${key}" value="${val || ''}">`;
  const sel = (label, val, opts, key) => `<label>${label}</label><select data-key="${key}">${opts.map(o => `<option${o === val ? ' selected' : ''}>${o}</option>`).join('')}</select>`;
  const bool = (label, val, key) => `<label><input type="checkbox" data-key="${key}"${val ? ' checked' : ''}> ${label}</label>`;
  if (it.x !== undefined) { html += num('X', it.x, 'x') + num('Z', it.z, 'z'); }
  else if (Array.isArray(it)) { html += num('X', it[0], '_a0') + num('Z', it[1], '_a1'); }
  if (it.ry !== undefined) html += num('Rot', it.ry, 'ry');
  if (it.w !== undefined) html += num('W', it.w, 'w');
  if (it.d !== undefined) html += num('D', it.d, 'd');
  if (it.h !== undefined) html += num('H', it.h, 'h');
  if (it.kind !== undefined) html += sel('Kind', it.kind, KIND_OPTIONS[cat] || ['box'], 'kind');
  if (it.name !== undefined) html += txt('Name', it.name || '', 'name');
  else if (cat !== 'spawns' && cat !== 'cover' && cat !== 'loot') html += txt('Name', '', 'name');
  if (it.m !== undefined) {
    const m = typeof it.m === 'object' && it.m ? it.m.m : it.m;
    html += sel('Mat', m || 'concrete', MATERIALS, '_mat');
  }
  if (cat === 'buildings') {
    html += bool('Roof', it.roof, 'roof');
    html += bool('Windows', it.windows, 'windows');
    html += bool('Enterable', it.enterable, 'enterable');
  }
  html += `<div class="fi-row"><button class="fi-btn" id="fi-del">Delete</button><button class="fi-btn" id="fi-center">Center</button></div>`;
  fi.innerHTML = html;
  fi.querySelectorAll('input[data-key], select[data-key]').forEach(el => {
    const handler = () => {
      const k = el.dataset.key;
      if (k === '_a0') { it[0] = +el.value; }
      else if (k === '_a1') { it[1] = +el.value; }
      else if (k === '_mat') { it.m = el.value; }
      else if (k === 'name') { it.name = el.value; }
      else if (el.type === 'checkbox') it[k] = el.checked;
      else if (el.type === 'number') it[k] = +el.value;
      else it[k] = el.value;
      redrawAll();
    };
    el.addEventListener('input', handler);
    el.addEventListener('change', handler);
  });
  const delBtn = fi.querySelector('#fi-del');
  if (delBtn) delBtn.addEventListener('click', () => { scene[cat].splice(idx, 1); selected = null; redrawAll(); });
  const centerBtn = fi.querySelector('#fi-center');
  if (centerBtn) centerBtn.addEventListener('click', () => {
    const cx = it.x !== undefined ? it.x : (Array.isArray(it) ? it[0] : 0);
    const cz = it.z !== undefined ? it.z : (Array.isArray(it) ? it[1] : 0);
    pTarget.set(cx, 0, cz); updateOrbit();
  });
}

// ============ validation ============
function validate() {
  issues = [];
  const B = scene;
  const distPtSeg = (px, pz, ax, az, bx, bz) => {
    const dx = bx - ax, dz = bz - az, len2 = dx * dx + dz * dz;
    if (len2 < 1e-9) return Math.hypot(px - ax, pz - az);
    let t = ((px - ax) * dx + (pz - az) * dz) / len2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (ax + t * dx), pz - (az + t * dz));
  };
  const roadSeqs = [];
  for (const r of B.roads || []) {
    const pts = r.points || [];
    for (let i = 0; i < pts.length - 1; i++) roadSeqs.push({ a: pts[i], b: pts[i + 1], w: r.w || 12 });
    if (pts.length > 2 && pts[0][0] === pts[pts.length - 1][0] && pts[0][1] === pts[pts.length - 1][1]) {
      roadSeqs.push({ a: pts[pts.length - 1], b: pts[0], w: r.w || 12 });
    }
  }
  const distToRoad = (x, z) => {
    let best = 1e9;
    for (const s of roadSeqs) best = Math.min(best, distPtSeg(x, z, s.a[0], s.a[1], s.b[0], s.b[1]));
    return best;
  };
  const radius = (b) => Math.hypot(b.w || 12, b.d || 12) / 2;
  const buildings = [];
  for (let i = 0; i < (B.buildings || []).length; i++) {
    const b = B.buildings[i];
    buildings.push({ kind: b.kind || 'box', x: b.x, z: b.z, r: radius(b), cat: 'buildings', idx: i });
  }
  for (let i = 0; i < (B.landmarks || []).length; i++) {
    const lm = B.landmarks[i];
    const r = { warehouse: Math.hypot(lm.w || 34, lm.d || 22) / 2, trainstation: Math.hypot(24, 12) / 2, port: Math.hypot(20, 14) / 2, fuel: (lm.r || 3) * 1.5, policestation: Math.hypot(lm.w || 16, lm.d || 12) / 2, nightclub: Math.hypot(lm.w || 18, lm.d || 16) / 2, mall: Math.hypot(lm.w || 40, lm.d || 20) / 2, stadium: Math.hypot(lm.w || 82, lm.d || 57) / 2, mosque: Math.hypot(lm.w || 16, lm.d || 14) / 2, transit: 5 }[lm.kind];
    if (r) buildings.push({ kind: lm.kind, x: lm.x, z: lm.z, r, cat: 'landmarks', idx: i });
  }
  const locOf = (b) => loc(b.cat, b.idx, b.x, b.z);
  const minClear = 7;
  for (const b of buildings) {
    const clear = distToRoad(b.x, b.z) - b.r;
    if (clear < minClear) issues.push({ lvl: 'err', msg: `BUILDING ${b.kind}@(${b.x},${b.z}) ${clear.toFixed(1)}m from road centerline (r=${b.r.toFixed(0)})`, loc: locOf(b) });
  }
  for (let i = 0; i < buildings.length; i++) {
    for (let j = i + 1; j < buildings.length; j++) {
      const a = buildings[i], b = buildings[j];
      const d = Math.hypot(a.x - b.x, a.z - b.z);
      if (d < a.r + b.r - 1) issues.push({ lvl: 'err', msg: `OVERLAP ${a.kind}@(${a.x},${a.z}) vs ${b.kind}@(${b.x},${b.z}) gap ${(d - a.r - b.r).toFixed(1)}m`, loc: locOf(a) });
    }
  }
  const inside = (x, z, b) => Math.hypot(x - b.x, z - b.z) < b.r + 1.5;
  const lmSpots = (B.landmarks || []).map((l) => [l.x, l.z]);
  const loc = (cat, idx, x, z) => ({ cat, idx, x, z });
  const checkPts = (arr, label, skipRoad, objCat) => {
    for (let i = 0; i < (arr || []).length; i++) {
      const p = arr[i];
      const x = Array.isArray(p) ? p[0] : p.x, z = Array.isArray(p) ? p[1] : p.z;
      for (const b of buildings) {
        if (inside(x, z, b)) { issues.push({ lvl: 'err', msg: `${label} (${x},${z}) inside ${b.kind}@(${b.x},${b.z})`, loc: loc(objCat, i, x, z) }); break; }
      }
      if (!skipRoad) {
        const d = distToRoad(x, z);
        const nearLm = lmSpots.some(([lx, lz]) => Math.hypot(x - lx, z - lz) < 35);
        if (d > 70 && !nearLm) issues.push({ lvl: 'warn', msg: `${label} (${x},${z}) is ${d.toFixed(0)}m from any road`, loc: loc(objCat, i, x, z) });
      }
    }
  };
  checkPts(B.spawns, 'SPAWN', false, 'spawns');
  checkPts(B.loot, 'LOOT', true, 'loot');
  checkPts(B.cover, 'COVER', true, 'cover');
  for (let i = 0; i < (B.props || []).length; i++) {
    const p = B.props[i];
    for (const b of buildings) {
      if (inside(p.x, p.z, b)) {
        issues.push({ lvl: 'err', msg: `PROP ${p.kind}@(${p.x},${p.z}) inside ${b.kind}@(${b.x},${b.z})`, loc: loc('props', i, p.x, p.z) });
        break;
      }
    }
  }
  for (let i = 0; i < (B.trees || []).length; i++) {
    const t = B.trees[i];
    for (const b of buildings) {
      if (Math.hypot(t.x - b.x, t.z - b.z) < b.r - 2) { issues.push({ lvl: 'warn', msg: `TREE (${t.x},${t.z}) too close to ${b.kind}@(${b.x},${b.z})`, loc: loc('trees', i, t.x, t.z) }); break; }
    }
  }
  return issues;
}
function renderIssues() {
  const box = document.createElement('div');
  box.id = 'issues';
  box.innerHTML = '';
  if (issues.length === 0) {
    const ok = document.createElement('div');
    ok.className = 'note';
    ok.textContent = 'Validation: all clear';
    box.append(ok);
  } else {
    const h = document.createElement('h2');
    h.style.cssText = 'margin-top:8px';
    h.textContent = `${issues.length} issue${issues.length > 1 ? 's' : ''} — click to locate`;
    box.append(h);
    for (const is of issues) {
      const d = document.createElement('div');
      d.className = 'issue ' + is.lvl;
      d.textContent = is.msg;
      d.addEventListener('click', () => {
        view.cx = is.loc.x; view.cz = is.loc.z; view.scale = Math.max(view.scale, 4);
        if (is.loc.cat >= 0) { selected = { cat: is.loc.cat, idx: is.loc.idx }; }
        draw2d(); renderInspector();
      });
      box.append(d);
    }
  }
  const old = insp.querySelector('#issues');
  if (old) old.remove();
  insp.append(box);
}

// ============ asset sub-editor (merged into inspector) ============
let subEditorCat = null, subEditorIdx = null;
function openSubEditor(cat, idx) {
  subEditorCat = cat; subEditorIdx = idx;
}

// ============ full-screen asset editor ============
let aeRenderer = null, aeScene = null, aeCam = null, aeWorld = null;
let aeOrbit = { yaw: 0.8, pitch: 0.45, dist: 25 };
let aeTarget = new THREE.Vector3(0, 3, 0);
let aeItem = null, aeCat = null, aeIdx = null;
let aeOmouse = null;

function openAssetEditor(cat, idx) {
  const it = scene[cat] && scene[cat][idx];
  if (!it) return;
  aeItem = it; aeCat = cat; aeIdx = idx;
  const wrap = $('#assetEditor');
  wrap.style.display = 'flex';
  const name = it.kind || it.type || cat;
  $('#aeAssetName').textContent = `${name.toUpperCase()} — ${cat} #${idx}`;

  // init renderer if needed
  if (!aeRenderer) {
    const c = $('#aeCanvas3d');
    aeRenderer = new THREE.WebGLRenderer({ canvas: c, antialias: true });
    aeRenderer.shadowMap.enabled = true;
    aeCam = new THREE.PerspectiveCamera(50, 1, 0.1, 500);
  }
  resizeAssetEditor();

  // build scene with just this asset
  if (aeScene) disposeScene(aeScene);
  aeScene = new THREE.Scene();
  aeScene.add(new THREE.AmbientLight(0xffffff, 0.5));
  const dl = new THREE.DirectionalLight(0xffffff, 1);
  dl.position.set(20, 30, 20); dl.castShadow = true;
  aeScene.add(dl);
  const dl2 = new THREE.DirectionalLight(0x8888ff, 0.3);
  dl2.position.set(-15, 20, -10); aeScene.add(dl2);

  // build just the single asset
  const sd = JSON.parse(JSON.stringify(scene));
  sd.buildings = cat === 'buildings' ? [it] : [];
  sd.landmarks = cat === 'landmarks' ? [it] : [];
  sd.props = cat === 'props' ? [it] : [];
  sd.roads = []; sd.pads = []; sd.vehicles = []; sd.trees = [];
  sd.spawns = []; sd.cover = []; sd.loot = []; sd.transit = []; sd.named = [];
  sd.reactives = [];
  sd.startPoint = { x: 0, z: 0, yaw: 0 };
  try { aeWorld = new World(aeScene, 'high', sd); } catch (e) { console.warn(e); }

  aeTarget.set(it.x || 0, (it.h || 4) / 2, it.z || 0);
  aeOrbit.dist = Math.max(it.w || 12, it.d || 12) * 1.2;
  updateAeOrbit();
  renderAeControls();
}

function closeAssetEditor() {
  $('#assetEditor').style.display = 'none';
  if (aeScene) { disposeScene(aeScene); aeScene = null; }
  aeItem = null; aeCat = null; aeIdx = null;
}

function resizeAssetEditor() {
  if (!aeRenderer) return;
  const r = $('#aeView3d').getBoundingClientRect();
  if (!r.width) return;
  aeRenderer.setSize(r.width, r.height);
  aeCam.aspect = r.width / r.height;
  aeCam.updateProjectionMatrix();
}

function updateAeOrbit() {
  if (!aeCam) return;
  aeCam.position.set(
    aeTarget.x + aeOrbit.dist * Math.cos(aeOrbit.pitch) * Math.sin(aeOrbit.yaw),

  };
  for (const it of (scene.buildings || [])) testObj('buildings', it, it.w || 12, it.d || 12);
  for (const it of (scene.props || [])) testObj('props', it, 2, 2);
  for (const it of (scene.landmarks || [])) testObj('landmarks', it, 8, 8);
  for (const it of (scene.vehicles || [])) testObj('vehicles', it, 3, 5);
  for (const it of (scene.trees || [])) testObj('trees', it, 2, 2);
  for (const it of (scene.pads || [])) testObj('pads', it, it.w || 20, it.d || 14);
  for (let i = 0; i < (scene.spawns || []).length; i++) { const it = scene.spawns[i]; testObj('spawns', it, 2, 2); }
  return best;
}

$('#canvas3d').addEventListener('mousedown', (e) => {
  if (!fs3d) return;
  if (document.activeElement && document.activeElement.tagName !== 'CANVAS') document.activeElement.blur();
  if (e.button === 1 || e.button === 2 || e.shiftKey) return; // pan handled by orbit
  const gHit = fs3dWorldHit(e);
  if (!gHit) return;

  if (tool === 'select') {
    const objHit = fs3dObjectHit(gHit.x, gHit.z);
    if (objHit) {
      selected = { cat: objHit.cat, idx: objHit.idx };
      const it = scene[objHit.cat][objHit.idx];
      const ix = it.x !== undefined ? it.x : (Array.isArray(it) ? it[0] : 0);
      const iz = it.z !== undefined ? it.z : (Array.isArray(it) ? it[1] : 0);
      fs3dDrag = { cat: objHit.cat, idx: objHit.idx, startWorld: gHit.clone(), startObj: { x: ix, z: iz } };
      renderInspector();
    } else {
      selected = null;
      renderInspector();
      oMouse = { x: e.clientX, y: e.clientY, b: 0 };
    }
  } else if (tool === 'building') {
    const w = +$('#roadW').value || 12, d = +$('#padD').value || 12;
    const kind = $('#kindSel').value || 'box';
    scene.buildings.push({ ...buildDefaults, kind, x: snap1(gHit.x), z: snap1(gHit.z), w, d });
    selected = { cat: 'buildings', idx: scene.buildings.length - 1 };
    redrawAll();
  } else if (tool === 'tree') {
    scene.trees.push({ x: snap1(gHit.x), z: snap1(gHit.z), s: 1, dead: false });
    redrawAll();
  } else if (tool === 'spawn') {
    scene.spawns.push([snap1(gHit.x), snap1(gHit.z)]);
    redrawAll();
  } else if (tool === 'startpoint') {
    scene.startPoint.x = snap1(gHit.x);
    scene.startPoint.z = snap1(gHit.z);
    redrawAll();
  } else if (tool === 'pad') {
    const pw = +$('#padW').value || 20, pd = +$('#padD').value || 14;
    scene.pads.push({ x: snap1(gHit.x), z: snap1(gHit.z), w: pw, d: pd, ry: 0, m: 'plaza' });
    selected = { cat: 'pads', idx: scene.pads.length - 1 };
    redrawAll();
  } else if (tool === 'prop') {
    const kind = $('#kindSel').value || 'crate';
    scene.props.push({ ...propDefaults[kind], x: snap1(gHit.x), z: snap1(gHit.z) });
    selected = { cat: 'props', idx: scene.props.length - 1 };
    redrawAll();
  } else if (tool === 'vehicle') {
    const kind = $('#kindSel').value || 'car';
    scene.vehicles.push({ x: snap1(gHit.x), z: snap1(gHit.z), ry: 0, kind });
    selected = { cat: 'vehicles', idx: scene.vehicles.length - 1 };
    redrawAll();
  } else if (tool === 'cover') {
    scene.cover.push([snap1(gHit.x), snap1(gHit.z)]);
    selected = { cat: 'cover', idx: scene.cover.length - 1 };
    redrawAll();
  } else if (tool === 'loot') {
    scene.loot.push([snap1(gHit.x), snap1(gHit.z)]);
    selected = { cat: 'loot', idx: scene.loot.length - 1 };
    redrawAll();
  } else if (tool === 'landmark') {
    const kind = $('#kindSel').value || 'fuel';
    scene.landmarks.push({ ...landmarkDefaults[kind], x: snap1(gHit.x), z: snap1(gHit.z) });
    selected = { cat: 'landmarks', idx: scene.landmarks.length - 1 };
    redrawAll();
  } else if (tool === 'road') {
    if (!roadDraft) roadDraft = { points: [], mouse: null };
    roadDraft.points.push([snap1(gHit.x), snap1(gHit.z)]);
    redrawAll();
  } else if (tool === 'text') {
    const objHit = fs3dObjectHit(gHit.x, gHit.z);
    if (objHit && (objHit.cat === 'buildings' || objHit.cat === 'landmarks')) {
      selected = { cat: objHit.cat, idx: objHit.idx };
      const it = scene[objHit.cat][objHit.idx];
      const txt = prompt('Enter text:', 'TEXT');
      if (txt) addOverlay(it, txt, gHit.x, gHit.z);
      redrawAll();
    }
  } else if (tool === 'erase') {
    const objHit = fs3dObjectHit(gHit.x, gHit.z);
    if (objHit) {
      scene[objHit.cat].splice(objHit.idx, 1);
      if (selected && selected.cat === objHit.cat && selected.idx === objHit.idx) selected = null;
      redrawAll();
    }
  }
});

window.addEventListener('mousemove', (e) => {
  if (!fs3d || !fs3dDrag || !selected) return;
  const gHit = fs3dWorldHit(e);
  if (!gHit) return;
  const it = scene[fs3dDrag.cat][fs3dDrag.idx];
  const dx = gHit.x - fs3dDrag.startWorld.x;
  const dz = gHit.z - fs3dDrag.startWorld.z;
  if (it.x !== undefined) { it.x = snap1(fs3dDrag.startObj.x + dx); it.z = snap1(fs3dDrag.startObj.z + dz); }
  else if (Array.isArray(it)) { it[0] = snap1(fs3dDrag.startObj.x + dx); it[1] = snap1(fs3dDrag.startObj.z + dz); }
  redrawAll();
});

window.addEventListener('mouseup', () => { fs3dDrag = null; });

// Q/E rotate in 3D mode
window.addEventListener('keydown', (e) => {
  if (!fs3d) return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (selected && (e.key === 'q' || e.key === 'Q')) {
    const it = scene[selected.cat][selected.idx];
    if (it && it.ry !== undefined) { it.ry = (it.ry || 0) - (e.shiftKey ? 0.5 : 0.15); redrawAll(); }
  }
  if (selected && (e.key === 'e' || e.key === 'E')) {
    const it = scene[selected.cat][selected.idx];
    if (it && it.ry !== undefined) { it.ry = (it.ry || 0) + (e.shiftKey ? 0.5 : 0.15); redrawAll(); }
  }
  if (e.key === 'Escape' && fs3d) toggleFullscreen3d();
});
</script>
</body>
