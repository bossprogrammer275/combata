<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asset Studio — STRIKE COMMAND</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#121512;--panel:#1a1d1a;--panel2:#222622;--border:#2a2e2a;--txt:#e8eae6;--dim:#7a8a7a;--acc:#c9a227;--acc2:#e8c84a;--hover:#1e3a1e;--selected:#2a4a2a}
body{background:var(--bg);color:var(--txt);font-family:"Segoe UI",Roboto,sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column}
#topbar{display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0}
#topbar h1{font-size:16px;color:var(--acc);font-weight:600;white-space:nowrap}
#topbar .sep{width:1px;height:20px;background:var(--border)}
#search{flex:1;max-width:320px;background:var(--panel2);border:1px solid var(--border);border-radius:4px;padding:5px 10px;color:var(--txt);font-size:13px;outline:none}
#search:focus{border-color:var(--acc)}
#stats{font-size:11px;color:var(--dim)}
#main{display:flex;flex:1;overflow:hidden}
#sidebar{width:220px;background:var(--panel);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;padding:8px 0}
.sidebar-title{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1.5px;padding:8px 12px 4px}
.col-btn{display:block;width:100%;text-align:left;background:none;border:none;color:var(--txt);padding:6px 12px;cursor:pointer;font-size:12px;border-left:3px solid transparent}
.col-btn:hover{background:var(--hover)}
.col-btn.active{background:var(--selected);border-left-color:var(--acc);color:var(--acc)}
.col-btn .count{float:right;color:var(--dim);font-size:11px}
#grid-wrap{flex:1;overflow-y:auto;padding:12px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.asset-card{background:var(--panel);border:1px solid var(--border);border-radius:6px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.asset-card:hover{border-color:var(--acc)}
.asset-card.selected{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.asset-thumb{width:100%;aspect-ratio:1;background:var(--panel2);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.asset-thumb img{width:100%;height:100%;object-fit:cover}
.asset-thumb .placeholder{color:var(--dim);font-size:40px;opacity:.3}
.asset-name{padding:6px 8px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asset-meta{padding:0 8px 6px;font-size:10px;color:var(--dim)}
#viewer{position:fixed;right:0;top:48px;bottom:0;width:420px;background:var(--panel);border-left:1px solid var(--border);display:none;flex-direction:column;z-index:20}
#viewer.open{display:flex}
#viewer-close{position:absolute;top:8px;right:8px;background:var(--panel2);border:1px solid var(--border);color:var(--txt);width:24px;height:24px;cursor:pointer;border-radius:3px;font-size:14px;z-index:5;display:flex;align-items:center;justify-content:center}
#viewer-close:hover{border-color:var(--acc)}
#viewer-canvas{flex:1;cursor:grab}
#viewer-canvas:active{cursor:grabbing}
#viewer-props{padding:12px;border-top:1px solid var(--border);max-height:200px;overflow-y:auto}
.prop-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.prop-row label{font-size:11px;color:var(--dim);width:55px;flex-shrink:0}
.prop-row input[type=range]{flex:1;accent-color:var(--acc)}
.prop-row .val{font-size:11px;color:var(--txt);width:36px;text-align:right}
.prop-row input[type=color]{width:32px;height:20px;padding:0;border:1px solid var(--border);background:var(--panel2)}
.btn{background:var(--panel2);border:1px solid var(--border);color:var(--txt);padding:5px 12px;cursor:pointer;font-size:11px;border-radius:3px}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.primary{background:var(--acc);color:#111;border-color:var(--acc)}
.btn.primary:hover{background:var(--acc2)}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(18,21,18,.95);z-index:100;flex-direction:column;gap:12px}
#loading .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{font-size:13px;color:var(--dim)}
#empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--dim)}
#empty h3{color:var(--acc);margin-bottom:8px}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--dim)}
</style>
</head>
<body>

<div id="topbar">
  <h1>ASSET STUDIO</h1>
  <div class="sep"></div>
  <input id="search" type="text" placeholder="Search models... (e.g. tree, temple, chair)">
  <span id="stats">Loading registry...</span>
</div>

<div id="main">
  <div id="sidebar">
    <div class="sidebar-title">Collections</div>
  </div>
  <div id="grid-wrap">
    <div id="grid"></div>
  </div>
</div>

<div id="viewer">
  <button id="viewer-close" title="Close">&times;</button>
  <canvas id="viewer-canvas"></canvas>
  <div id="viewer-props">
    <div class="prop-row">
      <label>Scale</label>
      <input type="range" id="v-scale" min="0.1" max="5" step="0.1" value="1">
      <span class="val" id="v-scale-val">1.0</span>
    </div>
    <div class="prop-row">
      <label>Rotate Y</label>
      <input type="range" id="v-ry" min="0" max="360" step="1" value="0">
      <span class="val" id="v-ry-val">0&deg;</span>
    </div>
    <div class="prop-row">
      <label>Tint</label>
      <input type="color" id="v-tint" value="#ffffff">
    </div>
    <div class="prop-row" style="justify-content:flex-end;gap:6px;margin-top:8px">
      <button class="btn" id="v-reset">Reset</button>
      <button class="btn primary" id="v-export">Copy Placement</button>
    </div>
    <div id="v-info" style="margin-top:8px;font-size:11px;color:var(--dim)"></div>
  </div>
</div>

<div id="loading"><div class="spinner"></div><p>Loading 3D asset registry...</p></div>

<script type="importmap">{"imports":{"three":"./js/lib/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './js/lib/OrbitControls.js';
import { loadRegistry, getCollections, getAssets, searchAssets, loadModel, getModelUrl } from './js/model-loader.js';

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

let registry = null;
let allAssets = [];
let filteredAssets = [];
let activeCollection = null;
let selectedAsset = null;
let vr = null, vScene = null, vCam = null, vControls = null;
let currentModel = null;
let vParams = { scale: 1, ry: 0, tint: '#ffffff' };

async function init() {
  try {
    registry = await loadRegistry();
    buildSidebar();
    allAssets = [];
    for (const col of registry) {
      for (const a of col.assets) {
        allAssets.push({ ...a, collectionId: col.id, collectionName: col.name });
      }
    }
    filteredAssets = allAssets;
    renderGrid();
    $('#stats').textContent = `${allAssets.length} models across ${registry.length} collections`;
    $('#loading').style.display = 'none';
  } catch (e) {
    $('#loading').innerHTML = `<p style="color:#c44">Failed to load registry: ${e.message}</p>`;
  }
}

function buildSidebar() {
  const sb = $('#sidebar');
  const title = sb.querySelector('.sidebar-title');
  const allBtn = document.createElement('button');
  allBtn.className = 'col-btn active';
  allBtn.innerHTML = `All <span class="count">${allAssets.length}</span>`;
  allBtn.onclick = () => selectCollection(null, allBtn);
  sb.append(allBtn);

  for (const col of registry) {
    const btn = document.createElement('button');
    btn.className = 'col-btn';
    btn.innerHTML = `${col.name} <span class="count">${col.assets.length}</span>`;
    btn.title = col.description;
    btn.onclick = () => selectCollection(col.id, btn);
    sb.append(btn);
  }
}

function selectCollection(id, btn) {
  activeCollection = id;
  $$('.col-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilter();
}

function applyFilter() {
  const q = $('#search').value.trim().toLowerCase();
  let list = activeCollection ? allAssets.filter(a => a.collectionId === activeCollection) : allAssets;
  if (q) list = list.filter(a => {
    const n = (a.name || '').toLowerCase();
    const t = (a.metadata?.attributes?.Type || '').toLowerCase();
    const c = (a.metadata?.attributes?.Category || '').toLowerCase();
    return n.includes(q) || t.includes(q) || c.includes(q);
  });
  filteredAssets = list;
  renderGrid();
}

function renderGrid() {
  const grid = $('#grid');
  grid.innerHTML = '';
  if (!filteredAssets.length) {
    grid.innerHTML = '<div id="empty"><h3>No models found</h3><p>Try a different search or collection.</p></div>';
    return;
  }
  for (let i = 0; i < filteredAssets.length; i++) {
    const a = filteredAssets[i];
    const card = document.createElement('div');
    card.className = 'asset-card' + (selectedAsset === a ? ' selected' : '');
    const thumbUrl = a.thumbnail_url || '';
    const name = a.name || 'Untitled';
    const type = a.metadata?.attributes?.Type || '';
    card.innerHTML = `
      <div class="asset-thumb">${thumbUrl ? `<img src="${thumbUrl}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` : ''}<div class="placeholder" style="${thumbUrl ? 'display:none' : ''}">&#9633;</div></div>
      <div class="asset-name" title="${name}">${name}</div>
      <div class="asset-meta">${type}</div>`;
    card.onclick = () => selectAsset(a);
    grid.append(card);
  }
}

async function selectAsset(asset) {
  selectedAsset = asset;
  $$('.asset-card').forEach(c => c.classList.remove('selected'));
  const idx = filteredAssets.indexOf(asset);
  const cards = $$('.asset-card');
  if (cards[idx]) cards[idx].classList.add('selected');
  openViewer(asset);
}

function openViewer(asset) {
  const wrap = $('#viewer');
  wrap.classList.add('open');
  if (!vr) initViewer();
  loadModelInViewer(asset);
}

function initViewer() {
  const canvas = $('#viewer-canvas');
  const rect = canvas.getBoundingClientRect();
  vr = new THREE.WebGLRenderer({ canvas, antialias: true });
  vr.setPixelRatio(Math.min(devicePixelRatio, 2));
  vr.setSize(rect.width, rect.height);
  vr.toneMapping = THREE.ACESFilmicToneMapping;
  vr.toneMappingExposure = 1.1;
  vScene = new THREE.Scene();
  vScene.background = new THREE.Color(0x1a1d1a);
  vScene.fog = new THREE.FogExp2(0x1a1d1a, 0.008);
  vCam = new THREE.PerspectiveCamera(50, rect.width / rect.height, 0.1, 500);
  vCam.position.set(0, 3, 8);
  vControls = new OrbitControls(vCam, canvas);
  vControls.target.set(0, 1.5, 0);
  vControls.enableDamping = true;
  vControls.dampingFactor = 0.08;
  vControls.update();

  vScene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const sun = new THREE.DirectionalLight(0xfff4e6, 1.5);
  sun.position.set(5, 10, 7);
  vScene.add(sun);
  const fill = new THREE.DirectionalLight(0x8899cc, 0.5);
  fill.position.set(-4, 6, -3);
  vScene.add(fill);

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(100, 100),
    new THREE.MeshStandardMaterial({ color: 0x2a2d2a, roughness: 0.95 })
  );
  ground.rotation.x = -Math.PI / 2;
  vScene.add(ground);
  vScene.add(new THREE.GridHelper(100, 50, 0x333333, 0x282828).translateY(0.01));

  const axis = new THREE.AxesHelper(3);
  axis.position.y = 0.02;
  vScene.add(axis);

  animateViewer();
  new ResizeObserver(() => {
    const r = canvas.getBoundingClientRect();
    if (r.width > 0 && r.height > 0) {
      vr.setSize(r.width, r.height);
      vCam.aspect = r.width / r.height;
      vCam.updateProjectionMatrix();
    }
  }).observe(canvas.parentElement);
}

function animateViewer() {
  requestAnimationFrame(animateViewer);
  if (!vr || !$('#viewer').classList.contains('open')) return;
  vControls.update();
  vr.render(vScene, vCam);
}

async function loadModelInViewer(asset) {
  if (currentModel) {
    vScene.remove(currentModel);
    currentModel = null;
  }
  const url = getModelUrl(asset);
  if (!url) return;
  try {
    const model = await loadModel(url);
    currentModel = model;
    vScene.add(model);
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const fov = vCam.fov * (Math.PI / 180);
    const dist = maxDim / (2 * Math.tan(fov / 2)) * 1.5;
    vCam.position.set(center.x + dist * 0.6, center.y + dist * 0.4, center.z + dist * 0.8);
    vControls.target.copy(center);
    vControls.update();
    vParams = { scale: 1, ry: 0, tint: '#ffffff' };
    $('#v-scale').value = 1; $('#v-scale-val').textContent = '1.0';
    $('#v-ry').value = 0; $('#v-ry-val').textContent = '0°';
    $('#v-tint').value = '#ffffff';
    const info = asset.metadata?.attributes || {};
    $('#v-info').innerHTML = [
      asset.name,
      info.Type, info.Category, info.Theme,
      info.Style, info.Setting, info.Function
    ].filter(Boolean).map(s => `<span style="background:var(--panel2);padding:1px 6px;border-radius:2px;margin-right:4px">${s}</span>`).join('');
  } catch (e) {
    console.error('Model load error:', e);
    const errBox = new THREE.Mesh(
      new THREE.BoxGeometry(2, 2, 2),
      new THREE.MeshStandardMaterial({ color: 0xff4444, wireframe: true })
    );
    vScene.add(errBox);
    currentModel = errBox;
  }
}

$('#v-scale').addEventListener('input', e => {
  vParams.scale = +e.target.value;
  $('#v-scale-val').textContent = vParams.scale.toFixed(1);
  if (currentModel) currentModel.scale.setScalar(vParams.scale);
});
$('#v-ry').addEventListener('input', e => {
  vParams.ry = +e.target.value;
  $('#v-ry-val').innerHTML = vParams.ry + '&deg;';
  if (currentModel) currentModel.rotation.y = vParams.ry * Math.PI / 180;
});
$('#v-tint').addEventListener('input', e => {
  vParams.tint = e.target.value;
  if (currentModel) {
    const c = new THREE.Color(vParams.tint);
    currentModel.traverse(ch => {
      if (ch.isMesh && ch.material) {
        ch.material.color.copy(c);
      }
    });
  }
});
$('#v-reset').addEventListener('click', () => {
  vParams = { scale: 1, ry: 0, tint: '#ffffff' };
  $('#v-scale').value = 1; $('#v-scale-val').textContent = '1.0';
  $('#v-ry').value = 0; $('#v-ry-val').textContent = '0°';
  $('#v-tint').value = '#ffffff';
  if (currentModel) {
    currentModel.scale.setScalar(1);
    currentModel.rotation.y = 0;
    currentModel.traverse(ch => {
      if (ch.isMesh && ch.material) ch.material.color.set(0xffffff);
    });
  }
});
$('#v-export').addEventListener('click', () => {
  if (!selectedAsset) return;
  const data = {
    model_url: getModelUrl(selectedAsset),
    name: selectedAsset.name,
    collection: selectedAsset.collectionName,
    scale: vParams.scale,
    rotation_y: vParams.ry,
    tint: vParams.tint,
    type: selectedAsset.metadata?.attributes?.Type || '',
    category: selectedAsset.metadata?.attributes?.Category || ''
  };
  navigator.clipboard.writeText(JSON.stringify(data, null, 2)).then(() => {
    $('#v-export').textContent = 'Copied!';
    setTimeout(() => { $('#v-export').textContent = 'Copy Placement'; }, 1500);
  });
});
$('#viewer-close').addEventListener('click', () => {
  $('#viewer').classList.remove('open');
});
$('#search').addEventListener('input', applyFilter);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#viewer').classList.contains('open')) {
    $('#viewer').classList.remove('open');
  }
});

init();
</script>
</body>
</html>
