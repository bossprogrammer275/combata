name: Asset calibrator tests

on:
  push:
    branches: [main]
    paths:
      - 'tools/asset-calibrator.mjs'
      - 'tools/asset-calibrator.test.mjs'
      - 'tools/traversal-physics.test.mjs'
      - 'tools/process-glbs.js'
      - 'tools/validate-asset-calibration.mjs'
      - 'tools/compare-asset-calibrations.mjs'
      - 'tools/asset-review.html'
      - 'tools/asset-review.js'
      - 'js/asset-calibration.js'
      - 'js/traversal-physics.js'
      - 'js/player.js'
      - 'js/character.js'
      - 'js/civilians.js'
      - 'js/npc-system/core-assets.js'
      - 'js/npc-system/animation-controller.js'
      - 'js/npc-system/npc-instance.js'
      - 'js/world.js'
      - 'js/physics.js'
      - 'js/vehicles.js'
      - 'server.js'
      - 'package.json'
      - '.github/workflows/asset-calibrator-tests.yml'
  pull_request:
    paths:
      - 'tools/asset-calibrator.mjs'
      - 'tools/asset-calibrator.test.mjs'
      - 'tools/traversal-physics.test.mjs'
      - 'tools/process-glbs.js'
      - 'tools/validate-asset-calibration.mjs'
      - 'tools/asset-review.html'
      - 'tools/asset-review.js'
      - 'js/asset-calibration.js'
      - 'js/traversal-physics.js'
      - 'js/player.js'
      - 'js/character.js'
      - 'js/civilians.js'
      - 'js/npc-system/core-assets.js'
      - 'js/npc-system/animation-controller.js'
      - 'js/npc-system/npc-instance.js'
      - 'js/world.js'
      - 'js/physics.js'
      - 'js/vehicles.js'
      - 'server.js'
      - 'package.json'
      - '.github/workflows/asset-calibrator-tests.yml'

permissions:
  contents: read

concurrency:
  group: asset-calibrator-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Run calibration and traversal regression tests
        run: npm run test:asset-calibration
      - name: Check calibration and runtime module syntax
        run: |
          node --check tools/asset-calibrator.mjs
          node --check tools/asset-calibrator.test.mjs
          node --check tools/traversal-physics.test.mjs
          node --check tools/process-glbs.js
          node --check tools/validate-asset-calibration.mjs
          node --check tools/compare-asset-calibrations.mjs
          node --check js/asset-calibration.js
          node --check js/traversal-physics.js
          node --check js/player.js
          node --check js/character.js
          node --check js/civilians.js
          node --check js/npc-system/core-assets.js
          node --check js/npc-system/animation-controller.js
          node --check js/npc-system/npc-instance.js
          node --check js/world.js
          node --check js/physics.js
          node --check js/vehicles.js
          node --check tools/asset-review.js
          node --check server.js
