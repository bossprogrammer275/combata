name: Character pipeline validation

on:
  push:
    branches: [main]
    paths:
      - "tools/character-pipeline/**"
      - ".github/workflows/character-pipeline-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/character-pipeline/**"
      - ".github/workflows/character-pipeline-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile character pipeline scripts
        run: |
          python -m py_compile tools/character-pipeline/animate_civilian.py
          python -m py_compile tools/character-pipeline/build_civilian.py
      - name: Ensure Mixamo steps require explicit user confirmation
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("tools/character-pipeline/animate_civilian.py").read_text(encoding="utf-8")
          assert "def wait_for_manual_marker_placement(page):" in source
          assert "[CONFIRM MANUAL MARKERS + NEXT CLICK]" in source
          assert "Expected 8 Mixamo landmarks" not in source
          assert "def confirm_console_action(action, details=\"\"):" in source
          assert "page.on(\"response\"" not in source
          assert "attach_character_status_listener" not in source
          assert "def auto_place_mixamo_markers" not in source
          assert "next_button.click()" not in source
          assert "accept the rig generated by Mixamo" in source
          assert "download the unanimated rigged base character" in source
          assert "Choose 1-" in source
          print("Marker placement is manual; critical actions require explicit console confirmation.")
          PY
