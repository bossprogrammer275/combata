name: Character pipeline validation

on:
  push:
    branches: [main]
    paths:
      - "tools/character-pipeline/**"
      - ".github/workflows/character-pipeline-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/character-pipeline/**"
      - ".github/workflows/character-pipeline-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile character pipeline scripts
        run: |
          python -m py_compile tools/character-pipeline/animate_civilian.py
          python -m py_compile tools/character-pipeline/build_civilian.py
      - name: Ensure manual rigging and console-picked animation downloads are enabled
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("tools/character-pipeline/animate_civilian.py").read_text(encoding="utf-8")
          assert "def wait_for_manual_marker_placement(page" in source
          assert "MANUAL MIXAMO RIGGING REQUIRED" in source
          assert "auto_place_mixamo_markers" not in source
          assert "_png_character_mask" not in source
          assert "def prompt_animation_selection(page, animations_mod, job)" in source
          assert "Choose 1-" in source
          assert "download_mod.confirm(page, str(output_path))" in source
          print("Manual Mixamo rigging, console animation selection and explicit output-path downloads are enabled.")
          PY
