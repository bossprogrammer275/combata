name: Recalibrate gameplay assets

on:
  push:
    branches: [main]
    paths:
      - 'tools/asset-calibrator.mjs'
      - 'tools/process-glbs.js'
      - 'tools/recalibrate-gameplay-assets.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'data/models/assets/**/*.glb'
      - 'data/models/assets/**/*.gltf'
      - 'data/models/cars/**/*.glb'
      - 'data/models/cars/**/*.gltf'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gameplay-asset-recalibration
  cancel-in-progress: false
jobs:
  recalibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate tools and tests
        run: |
          node --check tools/process-glbs.js
          node --check tools/asset-calibrator.mjs
          node --check tools/recalibrate-gameplay-assets.mjs
          pnpm test:asset-calibration
      - name: Archive old profiles and recalibrate physical models
        run: pnpm recalibrate:gameplay-assets
      - name: Commit generated sidecars
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/models/assets data/models/cars
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Rebuild gameplay calibration and collision sidecars"
          git push origin HEAD:main
