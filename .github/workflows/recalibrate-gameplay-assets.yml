name: Recalibrate gameplay assets

on:
  push:
    branches: [main]
    paths:
      - 'tools/asset-calibrator.mjs'
      - 'tools/process-glbs.js'
      - 'tools/recalibrate-gameplay-assets.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'data/models/assets/**/*.glb'
      - 'data/models/assets/**/*.gltf'
      - 'data/models/cars/**/*.glb'
      - 'data/models/cars/**/*.gltf'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recalibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate tools and tests
        run: |
          node --check tools/process-glbs.js
          node --check tools/asset-calibrator.mjs
          node --check tools/recalibrate-gameplay-assets.mjs
          pnpm test:asset-calibration
      - name: Archive old profiles and recalibrate physical models
        run: pnpm recalibrate:gameplay-assets
      - name: Commit generated sidecars
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/models/assets data/models/cars
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Rebuild gameplay calibration and collision sidecars"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push raced with another main update (attempt $attempt/3); rebasing and retrying."
              continue
            fi

            # Calibration sidecars are deterministic output from the source
            # assets. If another writer refreshed any of the same files, don't
            # merge snapshots; rebuild all gameplay profiles on latest main.
            git rebase --abort || true
            git reset --hard origin/main
            echo "Calibration sidecars conflicted with main; rebuilding from latest main (attempt $attempt/3)."
            pnpm recalibrate:gameplay-assets
            git add data/models/assets data/models/cars
            if git diff --cached --quiet; then
              echo "Latest main already has the regenerated gameplay sidecars."
              exit 0
            fi
            git commit -m "Rebuild gameplay calibration and collision sidecars"
          done
          echo "::error::Could not publish gameplay calibration sidecars after three retries."
          exit 1
