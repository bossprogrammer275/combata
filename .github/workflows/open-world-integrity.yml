name: Open-world integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate and validate city building collision sidecars
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail
          sources=(
            data/models/assets/low_poly_skyscraper.glb
            data/models/assets/kwara_revenue_house.glb
            data/models/assets/ilorin_innovation_hub.glb
          )
          missing=()
          changed_files=""

          # On a normal main push, if the generator itself changed, rebuild all
          # city manifests. On PRs, generatorVersion in each manifest provides
          # the same invalidation contract without requiring write permissions.
          if [[ "$GITHUB_EVENT_NAME" == "push" && -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            if git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              changed_files="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")"
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" && -n "${GITHUB_BASE_REF:-}" ]]; then
            git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
            changed_files="$(git diff --name-only FETCH_HEAD "$GITHUB_SHA")"
          fi
          regenerate_all=false
          if grep -Fxq "tools/process-glbs.js" <<< "$changed_files"; then
            regenerate_all=true
          fi

          for source in "${sources[@]}"; do
            sidecar="${source%.glb}_col.json"
            needs_regen="$regenerate_all"
            if [ ! -s "$sidecar" ]; then
              needs_regen=true
            elif [ "$needs_regen" = false ]; then
              if ! node --input-type=module -e '
                import crypto from "node:crypto";
                import fs from "node:fs";
                const [source, sidecar] = process.argv.slice(1);
                const data = JSON.parse(fs.readFileSync(sidecar, "utf8"));
                const hash = crypto.createHash("sha256").update(fs.readFileSync(source)).digest("hex");
                if (data.generatorVersion !== 2 || data.sourceSha256 !== hash ||
                    !Array.isArray(data.boxes) || data.boxes.length === 0 ||
                    !data.boxes.every(box => Array.isArray(box) && box.length >= 6 && box.every(Number.isFinite))) {
                  process.exit(1);
                }
              ' "$source" "$sidecar"; then
                needs_regen=true
              fi
            fi
            if [ "$needs_regen" = true ]; then missing+=("$source"); fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Regenerating collision manifests for: ${missing[*]}"
            node tools/process-glbs.js "${missing[@]}"
          else
            echo "All city collision manifests match their GLB sources and generator version."
          fi

          # Validate every committed/generated sidecar on every run, not merely
          # the files that happened to be regenerated this time.
          for source in "${sources[@]}"; do
            sidecar="${source%.glb}_col.json"
            if [ ! -s "$sidecar" ]; then
              echo "::error::Collision manifest is missing: $sidecar"
              exit 1
            fi
            node --input-type=module -e '
              import crypto from "node:crypto";
              import fs from "node:fs";
              const [source, sidecar] = process.argv.slice(1);
              const data = JSON.parse(fs.readFileSync(sidecar, "utf8"));
              const hash = crypto.createHash("sha256").update(fs.readFileSync(source)).digest("hex");
              if (data.generatorVersion !== 2) throw new Error(sidecar + " has a stale generatorVersion");
              if (data.sourceSha256 !== hash) throw new Error(sidecar + " was generated from a different GLB source");
              if (!Array.isArray(data.boxes) || data.boxes.length === 0) throw new Error(sidecar + " has no collision boxes");
              if (!data.boxes.every(box => Array.isArray(box) && box.length >= 6 && box.every(Number.isFinite))) {
                throw new Error(sidecar + " contains invalid collision boxes");
              }
              console.log(sidecar + ": " + data.boxes.length + " valid collision boxes");
            ' "$source" "$sidecar"
          done

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]] && [ "${#missing[@]}" -gt 0 ]; then
            for source in "${missing[@]}"; do git add -- "${source%.glb}_col.json"; done
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "chore: refresh city collision sidecars [skip ci]"
              git push origin HEAD:main
            fi
          fi
      - name: Check JavaScript syntax
        run: |
          node --check js/world.js
          node --check js/physics.js
          node --check js/bvh-collision.js
          node --check js/player.js
          node --check js/character.js
          node --check js/vehicles.js
          node --check js/civilians.js
          node --check js/npc-config.js
          node --check js/npc-character.js
          node --check tools/verify-npcs.mjs
          node --check js/main.js
          node --check js/textures.js
          node --check tools/process-glbs.js
          node --check tools/verify-collisions.mjs
      - name: Verify GLB collision pipeline
        run: node tools/verify-collisions.mjs
      - name: Verify vehicle models and Rapier basics
        run: node tools/verify-vehicles.mjs
      - name: Verify civilian model integration
        run: node tools/verify-npcs.mjs
